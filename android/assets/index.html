<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Split Buddy</title>
</head>
<body>

<style>
/* ============================================================
   Split Buddy — tokens
   Identity: ink-on-ledger. Blue-slate neutrals, navy ink accent,
   tabular mono figures, hairline bill rules.
   ============================================================ */
:root {
  --page:        #eef0f4;
  --surface:     #ffffff;
  --surface-2:   #f6f7fa;
  --surface-3:   #eaedf3;
  --border:      #dde1e9;
  --border-firm: #c6ccd9;
  --ink:         #141822;
  --ink-2:       #4c5464;
  --muted:       #7b8497;
  --accent:      #1b4fa0;
  --accent-ink:  #ffffff;
  --accent-soft: #e6edfa;
  --accent-line: #b9cdf0;
  --pos:         #0f7a2e;   /* you get back */
  --neg:         #c0392f;   /* you owe */
  --pos-soft:    #e4f4e8;
  --neg-soft:    #fbe9e7;
  --gold:        #9a6a06;

  --series:      #1b4fa0;
  --series-soft: #cfdcf3;
  --div-pos:     #1b4fa0;
  --div-neg:     #c0392f;
  --grid:        #e3e6ed;
  --axis:        #c6ccd9;

  --shadow-sm: 0 1px 2px rgba(20,24,34,.06);
  --shadow-md: 0 6px 24px -8px rgba(20,24,34,.22), 0 1px 2px rgba(20,24,34,.06);
  --shadow-lg: 0 24px 64px -20px rgba(20,24,34,.42);

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --font-display: system-ui, "Roboto", "Segoe UI", sans-serif;
  --font-body: system-ui, "Roboto", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "Roboto Mono", "Droid Sans Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page:        #0b0d12;
    --surface:     #161a21;
    --surface-2:   #1c212a;
    --surface-3:   #232935;
    --border:      #2a3140;
    --border-firm: #3a4354;
    --ink:         #edf0f6;
    --ink-2:       #b2bac9;
    --muted:       #838c9e;
    --accent:      #6ba4ec;
    --accent-ink:  #0b0d12;
    --accent-soft: #18263c;
    --accent-line: #2d4568;
    --pos:         #3fbf63;
    --neg:         #ef6a5c;
    --pos-soft:    #14301c;
    --neg-soft:    #35191a;
    --gold:        #d9a441;
    --series:      #5a9ae8;
    --series-soft: #24344f;
    --div-pos:     #5a9ae8;
    --div-neg:     #ef6a5c;
    --grid:        #242a35;
    --axis:        #3a4354;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 24px -8px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.4);
    --shadow-lg: 0 24px 64px -20px rgba(0,0,0,.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page:        #0b0d12;
  --surface:     #161a21;
  --surface-2:   #1c212a;
  --surface-3:   #232935;
  --border:      #2a3140;
  --border-firm: #3a4354;
  --ink:         #edf0f6;
  --ink-2:       #b2bac9;
  --muted:       #838c9e;
  --accent:      #6ba4ec;
  --accent-ink:  #0b0d12;
  --accent-soft: #18263c;
  --accent-line: #2d4568;
  --pos:         #3fbf63;
  --neg:         #ef6a5c;
  --pos-soft:    #14301c;
  --neg-soft:    #35191a;
  --gold:        #d9a441;
  --series:      #5a9ae8;
  --series-soft: #24344f;
  --div-pos:     #5a9ae8;
  --div-neg:     #ef6a5c;
  --grid:        #242a35;
  --axis:        #3a4354;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 24px -8px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.4);
  --shadow-lg: 0 24px 64px -20px rgba(0,0,0,.75);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* A class that sets `display` outbids the UA sheet's [hidden] rule, and the
   phone build supplies its own <head> with no reset. Without this the hidden
   lock overlay still swallows every tap. */
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 272px 1fr; min-height: 100vh; }
.rail {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
.brand h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 19px;
  margin: 0; letter-spacing: -.02em; display: flex; align-items: center; gap: 9px;
}
.brand .mark {
  width: 22px; height: 22px; border-radius: 5px; background: var(--accent);
  display: grid; place-items: center; flex: none;
}
.brand .mark svg { display: block; }
.brand p { margin: 4px 0 0 31px; font-size: 12px; color: var(--muted); }

.rail-scroll { flex: 1; overflow-y: auto; padding: 12px 10px; }
.rail-label {
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: 6px 8px; display: flex;
  justify-content: space-between; align-items: center;
}
.glist { display: flex; flex-direction: column; gap: 2px; }
.gitem-row { display: flex; align-items: center; border-radius: var(--r-md); }
.gitem-row:hover { background: var(--surface-2); }
.gitem-row.active { background: var(--accent-soft); }
.gitem {
  flex: 1; min-width: 0; text-align: left; background: none; border: 0;
  padding: 9px 4px 9px 10px; border-radius: var(--r-md);
  display: flex; align-items: baseline; gap: 10px;
}
.gitem .gn { flex: 1; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gitem-row.active .gn { color: var(--accent); font-weight: 600; }
.gitem .gb { font-size: 12px; }
.gdel {
  border: 0; background: none; color: var(--muted); padding: 7px 9px; margin-right: 2px;
  border-radius: var(--r-sm); display: grid; place-items: center; opacity: .5;
}
.gdel:hover { color: var(--neg); background: var(--neg-soft); opacity: 1; }
.gitem-row.active .gdel { opacity: .8; }
.rail-foot { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

/* ---------- main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 24px 0; position: sticky; top: 0; z-index: 20;
}
.topbar-row { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.gtitle { min-width: 0; flex: 1; }
.gtitle h2 {
  font-family: var(--font-display); font-size: clamp(20px, 3vw, 27px); font-weight: 700;
  margin: 0; letter-spacing: -.025em; text-wrap: balance;
}
.gtitle .sub { font-size: 13px; color: var(--muted); margin-top: 2px; display:flex; gap:10px; flex-wrap:wrap; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabs { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: 0; padding: 9px 13px 11px; font-size: 14px; font-weight: 500;
  color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .cnt { font-size: 11px; color: var(--muted); margin-left: 5px; font-family: var(--font-mono); }

.content { padding: 22px 24px 60px; flex: 1; }
.wrap { max-width: 1060px; margin: 0 auto; }

/* ---------- buttons ---------- */
.btn {
  border: 1px solid var(--border-firm); background: var(--surface); color: var(--ink);
  padding: 7px 13px; border-radius: var(--r-md); font-size: 13.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px; box-shadow: var(--shadow-sm);
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); border-color: var(--accent); }
.btn-ghost { border-color: transparent; box-shadow: none; background: none; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn-danger { color: var(--neg); border-color: var(--border); }
.btn-danger:hover { background: var(--neg-soft); border-color: var(--neg); }
.btn-destructive { background: var(--neg); border-color: var(--neg); color: var(--accent-ink); font-weight: 600; }
.btn-destructive:hover { background: var(--neg); border-color: var(--neg); filter: brightness(1.08); }
.confirm-text { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); white-space: pre-line; }
.confirm-text strong { color: var(--ink); }

/* Connection check */
.chk { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); }
.chk:last-child { border-bottom: 0; }
.chk .mk { flex: 0 0 auto; width: 17px; text-align: center; font-weight: 700; line-height: 1.5; }
.chk .mk.good { color: var(--pos); }
.chk .mk.bad { color: var(--neg); }
.chk .mk.warn { color: var(--gold); }
.chk .tx { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.chk .tx b { color: var(--ink); font-weight: 600; }
.chk .tx span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon { width: 15px; height: 15px; flex: none; }

/* ---------- cards / ledger ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
}
.card-hd {
  padding: 14px 18px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.card-hd h3 {
  margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-2); flex: 1;
}
.card-bd { padding: 6px 18px 14px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }

/* hero balance strip */
.hero {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 18px 20px; display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-end;
  box-shadow: var(--shadow-sm);
}
.hero-main { flex: 1; min-width: 220px; }
.hero-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.hero-figure {
  font-family: var(--font-mono); font-weight: 600; font-size: clamp(30px, 5.4vw, 42px);
  letter-spacing: -.03em; line-height: 1.1; margin-top: 4px;
}
.hero-note { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
.hero-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.hstat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.hstat .v { font-family: var(--font-mono); font-size: 17px; font-weight: 500; margin-top: 2px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.zero { color: var(--muted); }

/* ledger rows — the bill-rule device */
.ledger { display: flex; flex-direction: column; }
.lrow {
  display: flex; align-items: center; gap: 12px; padding: 11px 0;
  border-bottom: 1px dashed var(--border);
}
.lrow:last-child { border-bottom: 0; }
.lrow .who { font-weight: 500; }
.lrow .rule { flex: 1; border-bottom: 1px dotted var(--border-firm); height: 1px; min-width: 14px; opacity: .8; }
.lrow .amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.lrow .tag { font-size: 12px; color: var(--muted); }

.avatar {
  width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; background: var(--surface-3); color: var(--ink-2);
  border: 1px solid var(--border);
}
.avatar.me { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }

/* expense rows */
.erow {
  display: flex; align-items: center; gap: 13px; padding: 12px 6px 12px 2px;
  border-bottom: 1px solid var(--border); width: 100%; text-align: left;
  background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0;
}
.erow:last-child { border-bottom: 0; }
.erow:hover { background: var(--surface-2); }
.edate {
  width: 44px; flex: none; text-align: center; font-family: var(--font-mono);
  line-height: 1.15; color: var(--muted);
}
.edate .d { font-size: 16px; font-weight: 600; color: var(--ink-2); display: block; }
.edate .m { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.ebody { flex: 1; min-width: 0; }
.ebody .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ebody .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.eamt { text-align: right; flex: none; }
.eamt .total { font-family: var(--font-mono); font-weight: 500; }
.eamt .yours { font-size: 12px; margin-top: 1px; font-family: var(--font-mono); }
.pill {
  font-size: 11px; padding: 1.5px 7px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--muted); background: var(--surface-2); white-space: nowrap;
}
.pill.settle { border-color: var(--pos); color: var(--pos); background: var(--pos-soft); }

/* filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  background: var(--surface); border: 1px solid var(--border-firm); border-radius: var(--r-md);
  padding: 8px 10px; font-size: 14px; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input.err { border-color: var(--neg); }
.search { position: relative; flex: 1; min-width: 170px; }
.search input { padding-left: 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* segmented */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button {
  border: 0; background: none; padding: 6px 11px; border-radius: 7px; font-size: 13px;
  color: var(--ink-2); font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 600; }

/* empty */
.empty { text-align: center; padding: 44px 20px; color: var(--muted); }
.empty h4 { font-family: var(--font-display); font-size: 18px; color: var(--ink); margin: 0 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 40ch; font-size: 14px; }

/* banner */
.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r-md);
  background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; color: var(--ink-2);
  margin-bottom: 16px;
}
.banner.warn { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }

/* settle-up */
.settle-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 1px dashed var(--border); flex-wrap: wrap;
}
.settle-row:last-child { border-bottom: 0; }
.flow { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 200px; }
.flow .arrow { color: var(--muted); }
.flow .nm { font-weight: 500; }

/* charts */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip {
  position: fixed; pointer-events: none; z-index: 400; background: var(--surface);
  border: 1px solid var(--border-firm); border-radius: var(--r-sm); padding: 7px 10px;
  box-shadow: var(--shadow-md); font-size: 12.5px; opacity: 0; transition: opacity .1s;
  max-width: 230px;
}
.tip .tk { color: var(--muted); }
.tip .tv { font-family: var(--font-mono); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
.tbl td { padding: 8px; border-bottom: 1px solid var(--border); }
.tbl td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.scrollx { overflow-x: auto; }

/* modal */
.scrim {
  position: fixed; inset: 0; background: rgba(10,13,20,.55); backdrop-filter: blur(2px);
  display: grid; place-items: center; padding: 16px; z-index: 300;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg); width: min(620px, 100%); max-height: min(90vh, 900px);
  display: flex; flex-direction: column;
}
.modal-hd { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.modal-hd h3 { font-family: var(--font-display); font-size: 18px; margin: 0; flex: 1; letter-spacing: -.02em; }
.modal-bd { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-ft { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 9px; justify-content: flex-end; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 12px; color: var(--muted); }

/* split editor */
.split-list { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.split-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 11px;
  border-bottom: 1px solid var(--border);
}
.split-row:last-child { border-bottom: 0; }
.split-row.off { opacity: .45; }
.split-row .nm { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.split-row input[type="number"] { width: 96px; text-align: right; padding: 5px 8px; font-family: var(--font-mono); }
.split-row .calc { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); width: 88px; text-align: right; }
.split-foot {
  display: flex; justify-content: space-between; padding: 9px 11px; font-size: 13px;
  background: var(--surface-2); border-top: 1px solid var(--border);
}
.split-foot .bad { color: var(--neg); font-weight: 600; }
.split-foot .ok { color: var(--pos); font-weight: 600; }
.chk { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }

.memberchips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); font-size: 13px;
}
.chip button { border: 0; background: none; color: var(--muted); padding: 0 2px; line-height: 1; font-size: 15px; }
.chip button:hover { color: var(--neg); }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  background: var(--ink); color: var(--page); padding: 9px 16px; border-radius: 999px;
  font-size: 13.5px; font-weight: 500; z-index: 500; opacity: 0; transition: all .18s;
  box-shadow: var(--shadow-md); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.railbtn { display: none; }

/* ---------- passcode lock ---------- */
.lock {
  position: fixed; inset: 0; z-index: 600; background: var(--page);
  display: grid; place-items: center; padding: 24px 16px;

/* ---------- never wider than the screen ----------
   A phone set to a larger display size reports a NARROWER css viewport — 412dp

<script>
(function () {
"use strict";

/* ==========================================================
   1. Utilities
   ========================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, a, kids) => {
  const n = document.createElement(t);
  if (a) for (const k in a) {
    if (k === "class") n.className = a[k];
    else if (k === "html") n.innerHTML = a[k];
    else if (k === "text") n.textContent = a[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), a[k]);
    else if (a[k] !== null && a[k] !== undefined && a[k] !== false) n.setAttribute(k, a[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(c));
  return n;
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p) => (p || "") + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clone = o => JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

const CURRENCIES = [
  { code: "INR", label: "₹ Indian rupee", locale: "en-IN" },
  { code: "USD", label: "$ US dollar", locale: "en-US" },
  { code: "EUR", label: "€ Euro", locale: "de-DE" },
  { code: "GBP", label: "£ Pound sterling", locale: "en-GB" },
  { code: "AED", label: "د.إ UAE dirham", locale: "en-AE" },
  { code: "SGD", label: "$ Singapore dollar", locale: "en-SG" },
  { code: "AUD", label: "$ Australian dollar", locale: "en-AU" },
  { code: "JPY", label: "¥ Japanese yen", locale: "ja-JP" }
];
const CATEGORIES = ["Food & drink", "Groceries", "Transport", "Stay", "Entertainment", "Shopping", "Utilities", "Rent", "Health", "Gifts", "Other"];
const SPLIT_TYPES = [
  { id: "equal", label: "Equally", hint: "Everyone selected owes the same share." },
  { id: "exact", label: "Exact amounts", hint: "Type what each person owes. Must add up to the total." },
  { id: "percentage", label: "Percentages", hint: "Type each share as a percentage. Must add up to 100%." },
  { id: "shares", label: "Shares", hint: "Give each person a weight — 2 shares owe twice as much as 1." },
  { id: "adjustment", label: "Adjustments", hint: "Charge someone extra for their own item; the rest is split equally." }
];

function locFor(code) { const c = CURRENCIES.find(x => x.code === code); return c ? c.locale : "en-US"; }
function fmt(minor, code) {
  code = code || (S.group && S.group.currency) || "INR";
  try {
    return new Intl.NumberFormat(locFor(code), { style: "currency", currency: code, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(minor / 100);
  } catch (e) { return (minor / 100).toFixed(2) + " " + code; }
}
function fmtShort(minor, code) {
  code = code || (S.group && S.group.currency) || "INR";
  const v = Math.abs(minor) / 100;
  let s;
  if (v >= 1e7) s = (v / 1e7).toFixed(1) + "Cr";
  else if (v >= 1e5) s = (v / 1e5).toFixed(1) + "L";
  else if (v >= 1000) s = (v / 1000).toFixed(v >= 1e4 ? 0 : 1) + "k";
  else s = v.toFixed(0);
  let sym = "";
  try { sym = (0).toLocaleString(locFor(code), { style: "currency", currency: code }).replace(/[\d.,\s]/g, ""); } catch (e) { sym = ""; }
  return (minor < 0 ? "-" : "") + sym + s;
}
const toMinor = v => Math.round((Number(v) || 0) * 100);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function dateParts(s) { const p = String(s || todayStr()).split("-"); return { d: p[2] || "01", m: MONTHS[(parseInt(p[1], 10) || 1) - 1], y: p[0] }; }
function relTime(iso) {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
  const d = new Date(iso); return d.getDate() + " " + MONTHS[d.getMonth()];
}
function initials(name) {
  const p = String(name || "?").trim().split(/\s+/);
  return ((p[0] || "")[0] || "?").toUpperCase() + (p.length > 1 ? (p[p.length - 1][0] || "").toUpperCase() : "");
}

/* ==========================================================
   2. Money engine — all arithmetic in minor units (paise/cents)
   ========================================================== */

/** Spread `total` across `n` slots by weight, losing nothing to rounding. */
function distribute(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0);
  if (sum <= 0 || weights.length === 0) return weights.map(() => 0);
  const neg = total < 0 ? -1 : 1;
  const abs = Math.abs(total);
  const raw = weights.map(w => (abs * w) / sum);
  const base = raw.map(Math.floor);
  let rem = abs - base.reduce((a, b) => a + b, 0);
  const order = raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (let k = 0; k < order.length && rem > 0; k++, rem--) base[order[k][1]] += 1;
  return base.map(v => v * neg);
}

/**
 * Who owes what for one expense.
 * amount: minor units. parts: [memberId]. values: {memberId: number}
 * Returns {memberId: minorOwed}.
 */
function computeSplits(amount, type, parts, values) {
  const out = {};
  parts.forEach(p => (out[p] = 0));
  if (!parts.length) return out;
  values = values || {};

  if (type === "equal") {
    distribute(amount, parts.map(() => 1)).forEach((v, i) => (out[parts[i]] = v));
  } else if (type === "exact") {
    parts.forEach(p => (out[p] = toMinor(values[p])));
  } else if (type === "percentage") {
    const w = parts.map(p => Math.max(0, Number(values[p]) || 0));
    distribute(amount, w).forEach((v, i) => (out[parts[i]] = v));
  } else if (type === "shares") {
    const w = parts.map(p => Math.max(0, Number(values[p]) || 0));
    distribute(amount, w).forEach((v, i) => (out[parts[i]] = v));
  } else if (type === "adjustment") {
    // Each person may be charged an extra personal amount; the rest splits equally.
    const adj = parts.map(p => toMinor(values[p]));
    const adjSum = adj.reduce((a, b) => a + b, 0);
    const rest = amount - adjSum;
    const even = distribute(rest, parts.map(() => 1));
    parts.forEach((p, i) => (out[p] = adj[i] + even[i]));
  }
  return out;
}

/** Total each member actually paid out of pocket for an expense. */
function payersOf(e) {
  if (e.payers && Object.keys(e.payers).length) return e.payers;
  const o = {}; o[e.paidBy] = e.amount; return o;
}

/** Net position per member: positive = is owed money, negative = owes. */
function netBalances(members, expenses, settlements) {
  const net = {};
  members.forEach(m => (net[m.id] = 0));
  expenses.forEach(e => {
    const pay = payersOf(e);
    for (const id in pay) if (id in net) net[id] += pay[id];
    for (const id in (e.splits || {})) if (id in net) net[id] -= e.splits[id];
  });
  settlements.forEach(s => {
    if (s.from in net) net[s.from] += s.amount;
    if (s.to in net) net[s.to] -= s.amount;
  });
  return net;
}

/** Raw pairwise debts: who owes whom, before simplification. */
function pairwiseDebts(members, expenses, settlements) {
  const m = {};
  members.forEach(a => { m[a.id] = {}; members.forEach(b => { if (a.id !== b.id) m[a.id][b.id] = 0; }); });
  expenses.forEach(e => {
    const pay = payersOf(e);
    const paidTotal = Object.values(pay).reduce((a, b) => a + b, 0);
    if (paidTotal <= 0) return;
    for (const debtor in (e.splits || {})) {
      if (!(debtor in m)) continue;
      const owed = e.splits[debtor];
      if (owed <= 0) continue;
      const creditors = Object.keys(pay).filter(c => c in m);
      const weights = creditors.map(c => pay[c]);
      distribute(owed, weights).forEach((part, i) => {
        const cred = creditors[i];
        if (cred === debtor || !part) return;
        m[debtor][cred] += part;
      });
    }
  });
  settlements.forEach(s => {
    if (m[s.from] && m[s.from][s.to] !== undefined) m[s.from][s.to] -= s.amount;
  });
  // net out reciprocal pairs
  const out = [];
  const seen = {};
  members.forEach(a => members.forEach(b => {
    if (a.id >= b.id) return;
    const key = a.id + "|" + b.id;
    if (seen[key]) return; seen[key] = 1;
    const ab = (m[a.id] && m[a.id][b.id]) || 0;
    const ba = (m[b.id] && m[b.id][a.id]) || 0;
    const d = ab - ba;
    if (d > 0) out.push({ from: a.id, to: b.id, amount: d });
    else if (d < 0) out.push({ from: b.id, to: a.id, amount: -d });
  }));
  return out.sort((x, y) => y.amount - x.amount);
}

/** Greedy minimum-transaction settlement from net balances. */
function simplifyDebts(net) {
  const debtors = [], creditors = [];
  for (const id in net) {
    if (net[id] < 0) debtors.push({ id: id, amt: -net[id] });
    else if (net[id] > 0) creditors.push({ id: id, amt: net[id] });
  }
  debtors.sort((a, b) => b.amt - a.amt || (a.id < b.id ? -1 : 1));
  creditors.sort((a, b) => b.amt - a.amt || (a.id < b.id ? -1 : 1));
  const tx = [];
  let i = 0, j = 0, guard = 0;
  while (i < debtors.length && j < creditors.length && guard++ < 10000) {
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    if (pay > 0) tx.push({ from: debtors[i].id, to: creditors[j].id, amount: pay });
    debtors[i].amt -= pay; creditors[j].amt -= pay;
    if (debtors[i].amt <= 0) i++;
    if (creditors[j].amt <= 0) j++;
  }
  return tx.sort((a, b) => b.amount - a.amount);
}

/* ==========================================================
   3. State + storage (db capability, with local fallback)
   ========================================================== */
const S = {
  db: null, ready: false, offline: false,
  groups: [], gid: null, group: null,
  expenses: [], settlements: [],
  tab: "balances", simplify: true,
  q: "", fcat: "", fmem: "",
  unsub: []
};

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
const meKey = gid => "sl.me." + gid;
/** Which member row in this group is me. Once you have signed in with a
 *  number, the row carrying that number is you — no need to be asked. */
const myId = () => {
  if (!S.group) return null;
  const stored = LS.get(meKey(S.group.id), null);
  if (stored) return stored;
  const mine = myPhone();
  if (mine) {
    const m = (S.group.members || []).find(x => !x.deleted && x.phone === mine);
    if (m) { LS.set(meKey(S.group.id), m.id); return m.id; }
  }
  return null;
};
const meMember = () => { const id = myId(); return S.group ? (S.group.members || []).find(m => m.id === id) || null : null; };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

/* --- writes --- */
async function saveGroup(g) {
  g.updatedAt = nowISO();
  if (S.db) { try { await S.db.doc("groups/" + g.id).set(g); } catch (e) { handleDbErr(e); } }
  else {
    const i = S.groups.findIndex(x => x.id === g.id);
    i < 0 ? S.groups.push(g) : (S.groups[i] = g);
    markDirty("groups", g.id);
    localSave(); render();
  }
}
async function removeGroup(id, label) {
  const name = label || memberNameOfGroup(id);
  if (SYNC_ENABLED && !S.db) {
    // Tombstone, so every phone in the group learns it is gone.
    tombstoneGroup(id);
  } else {
    S.groups = S.groups.filter(g => g.id !== id);
    S.expenses = S.expenses.filter(e => e.gid !== id);
    S.settlements = S.settlements.filter(s => s.gid !== id);
  }
  const nextLive = liveGroups()[0];
  if (S.gid === id) selectGroup(nextLive ? nextLive.id : null);
  else render();

  if (S.db) {
    try {
      const exps = await S.db.collection("groups/" + id + "/expenses").get();
      await Promise.all(exps.docs.map(d => S.db.doc("groups/" + id + "/expenses/" + d.id).delete()));
      const setts = await S.db.collection("groups/" + id + "/settlements").get();
      await Promise.all(setts.docs.map(d => S.db.doc("groups/" + id + "/settlements/" + d.id).delete()));
      await S.db.doc("groups/" + id).delete();
      toast("“" + name + "” deleted");
    } catch (e) {
      handleDbErr(e);
      toast("Couldn't finish deleting “" + name + "” — reload and try again.");
    }
  } else {
    localSave();
    toast("“" + name + "” deleted");
  }
}

/** Local delete: tombstone it and let sync carry the news. */
function tombstoneGroup(id) {
  const g = S.groups.find(x => x.id === id);
  if (!g) return;
  g.deleted = true; g.updatedAt = nowISO();
  S.expenses.forEach(e => { if (e.gid === id && !e.deleted) { e.deleted = true; e.updatedAt = g.updatedAt; markDirty("expenses", e.id); } });
  S.settlements.forEach(s => { if (s.gid === id && !s.deleted) { s.deleted = true; s.updatedAt = g.updatedAt; markDirty("settlements", s.id); } });
  markDirty("groups", id);
}
function memberNameOfGroup(id) {
  const g = S.groups.find(x => x.id === id);
  return g ? g.name : "that group";
}
async function saveExpense(e) {
  e.updatedAt = nowISO();
  if (S.db) { try { await S.db.doc("groups/" + S.gid + "/expenses/" + e.id).set(e); } catch (err) { handleDbErr(err); } }
  else {
    const i = S.expenses.findIndex(x => x.id === e.id && x.gid === e.gid);
    i < 0 ? S.expenses.push(e) : (S.expenses[i] = e);
    markDirty("expenses", e.id);
    localSave(); render();
  }
}
async function deleteExpense(id) {
  if (S.db) { try { await S.db.doc("groups/" + S.gid + "/expenses/" + id).delete(); } catch (err) { handleDbErr(err); } }
  else {
    // A tombstone, not a splice: the other phones have to learn it went away.
    const e = S.expenses.find(x => x.id === id && x.gid === S.gid);
    if (e) { e.deleted = true; e.updatedAt = nowISO(); markDirty("expenses", e.id); }
    localSave(); render();
  }
}
async function saveSettlement(s) {
  s.updatedAt = nowISO();
  if (S.db) { try { await S.db.doc("groups/" + S.gid + "/settlements/" + s.id).set(s); } catch (err) { handleDbErr(err); } }
  else {
    const i = S.settlements.findIndex(x => x.id === s.id && x.gid === s.gid);
    i < 0 ? S.settlements.push(s) : (S.settlements[i] = s);
    markDirty("settlements", s.id);
    localSave(); render();
  }
}
async function deleteSettlement(id) {
  if (S.db) { try { await S.db.doc("groups/" + S.gid + "/settlements/" + id).delete(); } catch (err) { handleDbErr(err); } }
  else {
    const s = S.settlements.find(x => x.id === id && x.gid === S.gid);
    if (s) { s.deleted = true; s.updatedAt = nowISO(); markDirty("settlements", s.id); }
    localSave(); render();
  }
}
function handleDbErr(e) {
  const code = (e && e.code) || "";
  if (code === "quota_exceeded") toast("Storage is full — delete some old expenses first.");
  else if (code === "resource_exhausted") toast("Too many changes at once. Try again in a moment.");
  else if (code === "revoked") { S.offline = true; toast("Lost access to shared storage."); render(); }
  else toast("Couldn't save that. Try again.");
  console.warn("db error", e);
}

/* --- local fallback persistence --- */
function localSave() {
  LS.set("sl.groups", S.groups);
  LS.set("sl.expenses", S.expenses);
  LS.set("sl.settlements", S.settlements);
}
function localLoad() {
  S.groups = LS.get("sl.groups", []);
  S.expenses = LS.get("sl.expenses", []);
  S.settlements = LS.get("sl.settlements", []);
}

/* --- subscriptions --- */
function clearSubs() { S.unsub.forEach(u => { try { u(); } catch (e) { } }); S.unsub = []; }

function subscribeGroups() {
  if (!S.db) return;
  const un = S.db.collection("groups").onSnapshot(snap => {
    S.groups = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    S.groups.sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
    S.ready = true;
    if (!S.gid || !S.groups.some(g => g.id === S.gid)) {
      const first = S.groups[0] ? S.groups[0].id : null;
      if (first !== S.gid) { selectGroup(first); return; }
    }
    S.group = S.groups.find(g => g.id === S.gid) || null;
    render();
  }, e => { handleDbErr(e); S.ready = true; render(); });
  S.unsub.push(un);
}

function subscribeGroupData(gid) {
  if (!S.db || !gid) { render(); return; }
  const ue = S.db.collection("groups/" + gid + "/expenses").onSnapshot(snap => {
    S.expenses = snap.docs.map(d => Object.assign({ id: d.id, gid: gid }, d.data()));
    render();
  }, handleDbErr);
  const us = S.db.collection("groups/" + gid + "/settlements").onSnapshot(snap => {
    S.settlements = snap.docs.map(d => Object.assign({ id: d.id, gid: gid }, d.data()));
    render();
  }, handleDbErr);
  S.groupSubs = [ue, us];
  S.unsub.push(ue, us);
}

function selectGroup(gid) {
  if (S.groupSubs) { S.groupSubs.forEach(u => { try { u(); } catch (e) { } }); S.unsub = S.unsub.filter(u => S.groupSubs.indexOf(u) < 0); S.groupSubs = null; }
  S.gid = gid;
  S.group = S.groups.find(g => g.id === gid) || null;
  S.q = ""; S.fcat = ""; S.fmem = "";
  LS.set("sl.lastGroup", gid);
  if (S.db) { S.expenses = []; S.settlements = []; subscribeGroupData(gid); }
  setRail(false);
  render();
}

/* ==========================================================
   4. Derived views
   ========================================================== */
function groupExpenses(gid) { return S.expenses.filter(e => !gid || e.gid === gid || S.db); }
function currentExpenses() {
  const list = (S.db ? S.expenses.slice() : S.expenses.filter(e => e.gid === S.gid)).filter(e => !e.deleted);
  return list.sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
}
function currentSettlements() {
  const list = (S.db ? S.settlements.slice() : S.settlements.filter(s => s.gid === S.gid)).filter(s => !s.deleted);
  return list.sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
}
/** Live members of a group — tombstoned ones stay in the data so other phones
 *  learn about the removal, but they are not people any more. */
function liveMembers(g) { return ((g || {}).members || []).filter(m => !m.deleted); }
function memberName(id, g) {
  g = g || S.group; if (!g) return "Someone";
  const m = (g.members || []).find(x => x.id === id);
  return m ? displayNameFor(m) : "Removed member";
}
function nameOrYou(id) { return id === myId() ? "You" : memberName(id); }

function groupNetFor(g) {
  // used by the rail: this viewer's balance inside group g
  const me = LS.get(meKey(g.id), null);
  if (!me || !S.db) return null;
  if (g.id !== S.gid) return null;
  const net = netBalances(liveMembers(g), currentExpenses(), currentSettlements());
  return net[me] === undefined ? null : net[me];
}

/* ==========================================================
   5. Rendering
   ========================================================== */
function render() {
  renderRail();
  renderTop();
  const v = $("#view");
  v.innerHTML = "";
  if (!S.ready && S.db) { v.appendChild(el("div", { class: "empty", html: "<p>Loading your ledger…</p>" })); return; }
  if (!S.group) { v.appendChild(emptyNoGroup()); return; }
  if (!myId()) { v.appendChild(whoAreYouCard()); }
  if (S.tab === "balances") renderBalances(v);
  else if (S.tab === "expenses") renderExpenses(v);
  else if (S.tab === "insights") renderInsights(v);
  else renderActivity(v);
}

function renderRail() {
  const list = $("#groupList"); list.innerHTML = "";
  const live = liveGroups();
  $("#groupCount").textContent = live.length ? live.length : "";
  if (!live.length) {
    list.appendChild(el("p", { class: "hint", style: "padding:8px 10px",
      text: "No groups yet. Create one to start splitting." }));

  }
  live.forEach(g => {
    const net = g.id === S.gid ? (myId() ? netBalances(liveMembers(g), currentExpenses(), currentSettlements())[myId()] : null) : null;
    const b = net == null || net === 0 ? null : el("span", {
      class: "gb mono " + (net > 0 ? "pos" : "neg"),

    });

    row.appendChild(el("button", {
      class: "gitem", "aria-current": g.id === S.gid ? "true" : "false",
      onclick: () => selectGroup(g.id)
    }, [el("span", { class: "gn", text: g.name }), b]));
    const admin = iAmAdmin(g);
    row.appendChild(el("button", {
      class: "gdel",
      title: admin ? "Delete " + g.name : "Remove " + g.name + " from my account",
      "aria-label": admin ? "Delete group " + g.name
                          : "Remove " + g.name + " from my account",
      onclick: (ev) => { ev.stopPropagation(); confirmDeleteGroup(g); }
    }, [iconSvg("M3 4.4h10M6.4 4.4V2.9h3.2v1.5M4.7 4.4l.6 8.3a.9.9 0 0 0 .9.8h3.6a.9.9 0 0 0 .9-.8l.6-8.3")]));
    list.appendChild(row);
  });
}

/** Delete a group.
 *
 *  Two different things wear the same button, and which one you get depends on
 *  whether you made the group:
 *
 *    the creator   deletes it for everyone. The tombstone syncs and the group
 *                  disappears from every phone in it.
 *    anyone else   removes it from their own phone and nothing else. They stay
 *                  in the group, their share of every expense still counts for
 *                  the others, and nobody is told.
 *
 *  Being explicit about which is about to happen matters more here than
 *  anywhere else in the app: one of them is irreversible and takes other
 *  people's records with it. */
function confirmDeleteGroup(g) {
  if (!iAmAdmin(g)) return confirmHideGroup(g);
  confirmModal({
    title: "Delete this group for everyone?",
    danger: true,
    confirmLabel: "Delete for everyone",
    message: "<strong>" + esc(g.name) + "</strong> and everything in it — its members, every expense and all recorded payments — will be removed.\n\nThis cannot be undone"
      + (S.db ? ", and it disappears for everyone who can open this page."
              : (SYNC_ENABLED ? ", and it disappears from every phone in the group — not just yours."
                              : ".")),
    onConfirm: () => removeGroup(g.id, g.name)
  });
}

/** The non-creator's version: it goes from this account, and nowhere else.
 *
 *  This is permanent by design. There is no undo and no restore list — being
 *  able to put a group back was what made the removal feel provisional, and
 *  provisional state is what let a sync quietly reverse it. */
function confirmHideGroup(g) {
  confirmModal({
    title: "Remove this group?",
    danger: true,
    confirmLabel: "Remove from my account",
    message: "<strong>" + esc(g.name) + "</strong> will be removed from your account.\n\n"
      + "Other members will continue to see and use the group. You are still in it, "
      + "and your share of every expense still counts in their balances — you simply "
      + "will not see it any more.\n\n"
      + "This cannot be undone.",
    onConfirm: () => {
      hideGroup(g.id);
      const next = liveGroups()[0];
      if (S.gid === g.id) selectGroup(next ? next.id : null);
      else render();
      toast("“" + g.name + "” removed from your account");
    }
  });
}

/* ---------- Balances tab ---------- */

   ========================================================== */
const TIP = {
  show(evt, html) {
    const t = $("#tip"); t.innerHTML = html; t.style.opacity = "1";
    const r = t.getBoundingClientRect();
    let x = evt.clientX + 14, y = evt.clientY - r.height - 10;
    if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 14;
    if (y < 8) y = evt.clientY + 18;
    t.style.left = x + "px"; t.style.top = y + "px";
  },
  hide() { $("#tip").style.opacity = "0"; }
};
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  return n;
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/** Horizontal magnitude bars — one series, one hue, direct value labels. */
function barsH(rows, opts) {
  opts = opts || {};
  const W = 560, rowH = 30, padT = 6, padB = 4;
  const labelW = opts.labelW || 130, valW = 92;
  const H = padT + padB + rows.length * rowH;
  const s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.aria || "bar chart" });
  const max = Math.max(1, ...rows.map(r => r.value));
  const trackX = labelW + 8, trackW = W - trackX - valW;
  rows.forEach((r, i) => {
    const y = padT + i * rowH;
    const bw = Math.max(2, (r.value / max) * trackW);
    s.appendChild(svg("text", { x: labelW, y: y + 19, "text-anchor": "end", fill: "var(--ink-2)", "font-size": "12.5", "font-family": "var(--font-body)" })).textContent = r.label;
    s.appendChild(svg("rect", { x: trackX, y: y + 8, width: trackW, height: 14, rx: 4, fill: "var(--surface-3)" }));
    const bar = svg("rect", { x: trackX, y: y + 8, width: bw, height: 14, rx: 4, fill: "var(--series)" });
    bar.style.cursor = "default";
    bar.addEventListener("mousemove", ev => TIP.show(ev, '<div class="tk">' + esc(r.label) + '</div><div class="tv">' + esc(r.display) + "</div>" + (r.note ? '<div class="tk">' + esc(r.note) + "</div>" : "")));
    bar.addEventListener("mouseleave", TIP.hide);
    s.appendChild(bar);
    const tv = svg("text", { x: W - 2, y: y + 19, "text-anchor": "end", fill: "var(--ink)", "font-size": "12.5", "font-family": "var(--font-mono)", "font-weight": "500" });
    tv.textContent = r.display;
    s.appendChild(tv);
  });
  return s;
}

/** Diverging balance chart: owes (left, red) vs gets back (right, blue). */
function divergingBars(rows, opts) {
  const W = 560, rowH = 32, padT = 8, padB = 22;
  const H = padT + padB + rows.length * rowH;
  const s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Balance per member" });
  const mid = W / 2;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.value)));
  const half = W / 2 - 96;
  s.appendChild(svg("line", { x1: mid, y1: padT, x2: mid, y2: H - padB, stroke: "var(--axis)", "stroke-width": "1" }));
  rows.forEach((r, i) => {
    const y = padT + i * rowH;
    const w = Math.max(r.value === 0 ? 0 : 2, (Math.abs(r.value) / maxAbs) * half);
    const isPos = r.value > 0;
    const x = isPos ? mid + 1 : mid - w - 1;
    if (r.value !== 0) {
      const bar = svg("rect", { x: x, y: y + 7, width: w, height: 16, rx: 4, fill: isPos ? "var(--div-pos)" : "var(--div-neg)" });
      bar.addEventListener("mousemove", ev => TIP.show(ev, '<div class="tk">' + esc(r.label) + '</div><div class="tv">' + esc(r.display) + '</div><div class="tk">' + (isPos ? "gets back" : "owes") + "</div>"));
      bar.addEventListener("mouseleave", TIP.hide);
      s.appendChild(bar);
    }
    const lbl = svg("text", {
      x: isPos ? mid - 8 : mid + 8, y: y + 20,
      "text-anchor": isPos ? "end" : "start",
      fill: "var(--ink-2)", "font-size": "12.5", "font-family": "var(--font-body)"
    });
    lbl.textContent = r.label;
    s.appendChild(lbl);
    const val = svg("text", {
      x: isPos ? Math.min(W - 2, mid + w + 8) : Math.max(2, mid - w - 8), y: y + 20,
      "text-anchor": isPos ? "start" : "end",
      fill: "var(--ink)", "font-size": "12", "font-family": "var(--font-mono)", "font-weight": "500"
    });
    val.textContent = r.display;
    s.appendChild(val);
  });
  const lo = svg("text", { x: mid - 8, y: H - 6, "text-anchor": "end", fill: "var(--muted)", "font-size": "11", "font-family": "var(--font-body)" });
  lo.textContent = "owes";
  const hi = svg("text", { x: mid + 8, y: H - 6, "text-anchor": "start", fill: "var(--muted)", "font-size": "11", "font-family": "var(--font-body)" });
  hi.textContent = "gets back";
  s.appendChild(lo); s.appendChild(hi);
  return s;
}

/** Monthly columns with a hairline grid and an emphasized latest bar. */
function columns(rows, opts) {
  const W = 560, H = 220, padL = 52, padR = 10, padT = 12, padB = 34;
  const s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Spending by month" });
  const max = Math.max(1, ...rows.map(r => r.value));
  const step = niceStep(max);
  const top = Math.ceil(max / step) * step;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  for (let t = 0; t <= top + 0.001; t += step) {
    const y = padT + plotH - (t / top) * plotH;
    s.appendChild(svg("line", { x1: padL, y1: y, x2: W - padR, y2: y, stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": "1" }));
    const tx = svg("text", { x: padL - 8, y: y + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": "11", "font-family": "var(--font-mono)" });
    tx.textContent = fmtShort(t, S.group && S.group.currency);
    s.appendChild(tx);
  }
  const bw = Math.min(46, (plotW / Math.max(1, rows.length)) - 10);
  rows.forEach((r, i) => {
    const cx = padL + (plotW / rows.length) * (i + 0.5);
    const h = (r.value / top) * plotH;
    const y = padT + plotH - h;
    const bar = svg("rect", {
      x: cx - bw / 2, y: y, width: bw, height: Math.max(h, r.value > 0 ? 2 : 0), rx: 4,
      fill: i === rows.length - 1 ? "var(--series)" : "var(--series)", opacity: i === rows.length - 1 ? "1" : "0.68"
    });
    bar.addEventListener("mousemove", ev => TIP.show(ev, '<div class="tk">' + esc(r.label) + '</div><div class="tv">' + esc(r.display) + '</div><div class="tk">' + r.count + " " + (r.count === 1 ? "expense" : "expenses") + "</div>"));
    bar.addEventListener("mouseleave", TIP.hide);
    s.appendChild(bar);
    const lx = svg("text", { x: cx, y: H - 12, "text-anchor": "middle", fill: "var(--muted)", "font-size": "11", "font-family": "var(--font-body)" });
    lx.textContent = r.label;
    s.appendChild(lx);
  });
  return s;
}
function niceStep(max) {
  const rough = max / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(1, rough))));
  const n = rough / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}

function renderInsights(v) {
  const g = S.group, exps = currentExpenses(), setts = currentSettlements();

  if (!exps.length) {

      el("button", { class: "btn btn-primary", text: "Add expense", onclick: () => openExpenseModal(null) })
    ])]));
    return;
  }

  const total = exps.reduce((a, e) => a + e.amount, 0);
  const days = (() => {
    const ds = exps.map(e => e.date).sort();
    const a = new Date(ds[0]), b = new Date(ds[ds.length - 1]);
    return Math.max(1, Math.round((b - a) / 86400000) + 1);
  })();
  const strip = el("div", { class: "hero", style: "margin-bottom:18px" });
  const sm = el("div", { class: "hero-main" });

  sm.appendChild(el("div", { class: "hero-figure", text: fmt(total, g.currency) }));
  sm.appendChild(el("div", { class: "hero-note", text: exps.length + " expenses over " + days + " " + (days === 1 ? "day" : "days") }));
  strip.appendChild(sm);
  const ss = el("div", { class: "hero-stats" });
  const biggest = exps.slice().sort((a, b) => b.amount - a.amount)[0];
  [
    ["Average expense", fmt(Math.round(total / exps.length), g.currency)],
    ["Per person", fmt(Math.round(total / Math.max(1, members.length)), g.currency)],
    ["Largest", fmt(biggest.amount, g.currency)],
    ["Payments settled", fmt(setts.reduce((a, s) => a + s.amount, 0), g.currency)]
  ].forEach(([k, val]) => {
    const d = el("div", { class: "hstat" });
    d.appendChild(el("div", { class: "k", text: k }));
    d.appendChild(el("div", { class: "v", text: val }));
    ss.appendChild(d);
  });
  strip.appendChild(ss);

  const grid = el("div", { class: "chart-grid" });

  // by category
  const catMap = {};
  exps.forEach(e => { const c = e.category || "Other"; catMap[c] = (catMap[c] || 0) + e.amount; });
  const catRows = Object.keys(catMap).map(k => ({ label: k, value: catMap[k] }))
    .sort((a, b) => b.value - a.value).slice(0, 9);
  catRows.forEach(r => { r.display = fmt(r.value, g.currency); r.note = Math.round((r.value / total) * 100) + "% of group spend"; });
  grid.appendChild(chartCard("Where the money goes", "Total spend per category, largest first.",
    barsH(catRows, { aria: "Spend by category" }),
    simpleTable(["Category", "Amount", "Share"], catRows.map(r => [r.label, fmt(r.value, g.currency), Math.round((r.value / total) * 100) + "%"]))));

  // who paid
  const payRows = members.map(m => ({
    label: displayNameFor(m),
    value: exps.reduce((a, e) => a + (payersOf(e)[m.id] || 0), 0)
  })).sort((a, b) => b.value - a.value);
  payRows.forEach(r => { r.display = fmt(r.value, g.currency); r.note = Math.round((r.value / total) * 100) + "% of the bills"; });
  grid.appendChild(chartCard("Who fronts the bills", "How much each person has paid out of pocket — not what they owe.",
    barsH(payRows, { aria: "Amount paid per person", labelW: 110 }),
    simpleTable(["Member", "Paid", "Their share"], members.map(m => [
      displayNameFor(m),
      fmt(exps.reduce((a, e) => a + (payersOf(e)[m.id] || 0), 0), g.currency),
      fmt(exps.reduce((a, e) => a + ((e.splits || {})[m.id] || 0), 0), g.currency)
    ]))));

  // monthly
  const mMap = {};
  exps.forEach(e => {
    const k = String(e.date).slice(0, 7);
    if (!mMap[k]) mMap[k] = { total: 0, count: 0 };
    mMap[k].total += e.amount; mMap[k].count++;
  });
  const monthRows = Object.keys(mMap).sort().slice(-12).map(k => {
    const p = k.split("-");
    return { label: MONTHS[parseInt(p[1], 10) - 1] + " " + p[0].slice(2), value: mMap[k].total, count: mMap[k].count, display: fmt(mMap[k].total, g.currency) };
  });
  grid.appendChild(chartCard("Spending by month", "The most recent month is emphasised.",
    columns(monthRows),
    simpleTable(["Month", "Spend", "Expenses"], monthRows.map(r => [r.label, r.display, String(r.count)]))));

  // balance diverging
  const net = netBalances(members, exps, setts);
  const balRows = members.map(m => ({ label: displayNameFor(m), value: net[m.id] || 0, display: fmt(Math.abs(net[m.id] || 0), g.currency) }))
    .sort((a, b) => b.value - a.value);
  const balCard = chartCard("Standing balance", "Left of the line is money owed; right of the line is money to come back.",
    divergingBars(balRows),
    simpleTable(["Member", "Balance", "Direction"], balRows.map(r => [r.label, r.display, r.value > 0 ? "gets back" : r.value < 0 ? "owes" : "settled"])));
  const lg = el("div", { class: "legend" });
  lg.appendChild(el("span", { html: '<span class="swatch" style="background:var(--div-neg)"></span> owes the group' }));
  lg.appendChild(el("span", { html: '<span class="swatch" style="background:var(--div-pos)"></span> is owed by the group' }));
  $(".card-bd", balCard).appendChild(lg);
  grid.appendChild(balCard);

  v.appendChild(grid);
}

/* ==========================================================
   7. Modals
   ========================================================== */
var backStack = [], pendingPops = 0;
function pushBack(key, closeFn) {
  backStack.push({ key: key, close: closeFn });
  try { history.pushState({ sl: key }, ""); } catch (e) { }
}
function releaseBack(key) {
  for (var i = backStack.length - 1; i >= 0; i--) {
    if (backStack[i].key !== key) continue;
    var wasTop = (i === backStack.length - 1);
    backStack.splice(i, 1);
    if (wasTop) { pendingPops++; try { history.back(); } catch (e) { pendingPops--; } }
    return;
  }
}
window.addEventListener("popstate", function () {
  if (pendingPops > 0) { pendingPops--; return; }   // our own history.back(), already handled
  var top = backStack.pop();
  if (top) top.close();                             // closers are idempotent, never touch history
});
function closeModalRaw() { $("#modalRoot").innerHTML = ""; document.removeEventListener("keydown", escClose); }
function closeModal() { closeModalRaw(); releaseBack("modal"); }
function escClose(e) { if (e.key === "Escape") closeModal(); }
function openModal(title, bodyNodes, footNodes) {
  const root = $("#modalRoot");
  const hadModal = !!root.innerHTML;
  root.innerHTML = "";
  const scrim = el("div", { class: "scrim", onclick: (e) => { if (e.target === scrim) closeModal(); } });
  const m = el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title });
  const hd = el("div", { class: "modal-hd" });
  hd.appendChild(el("h3", { text: title }));
  hd.appendChild(el("button", { class: "btn btn-sm btn-ghost", text: "✕", "aria-label": "Close", onclick: closeModal }));
  m.appendChild(hd);
  const bd = el("div", { class: "modal-bd" });
  bodyNodes.forEach(n => n && bd.appendChild(n));
  m.appendChild(bd);
  const ft = el("div", { class: "modal-ft" });
  footNodes.forEach(n => n && ft.appendChild(n));
  m.appendChild(ft);
  scrim.appendChild(m);
  root.appendChild(scrim);
  if (!hadModal) pushBack("modal", closeModalRaw);
  document.addEventListener("keydown", escClose);
  const first = m.querySelector("input,select,textarea");
  if (first) setTimeout(() => first.focus(), 30);
  return m;
}
/**
 * In-app confirmation. Never window.confirm() — a bare Android WebView has no
 * dialog handler and silently answers "no", and a sandboxed frame can suppress
 * it too, which makes destructive buttons look dead.
 */
function confirmModal(o) {
  const body = [el("p", { class: "confirm-text", html: o.message })];
  const go = el("button", {
    class: "btn " + (o.danger ? "btn-destructive" : "btn-primary"),
    text: o.confirmLabel || "Confirm",
    onclick: () => { closeModal(); setTimeout(() => o.onConfirm(), 0); }
  });
  openModal(o.title, body, [el("button", { class: "btn", text: o.cancelLabel || "Cancel", onclick: closeModal }), go]);
}

function field(labelText, control, hint) {
  const f = el("div", { class: "field" });
  const id = control.id || uid("f");
  control.id = id;
  f.appendChild(el("label", { for: id, text: labelText }));
  f.appendChild(control);
  if (hint) f.appendChild(el("div", { class: "hint", text: hint }));
  return f;
}

/* ---------- contacts ----------
 * The phone build exposes one method that opens Android's own contact
 * picker. The app never reads the address book: the picker runs outside
 * it and hands back only the single person tapped, which is why no
 * contacts permission is needed. Absent in a browser — the button hides.
 */
function contactsAvailable() {
  return !!(window.AndroidBridge && typeof window.AndroidBridge.pickContact === "function");
}
let contactPending = null;
function pickFromContacts(cb) {
  if (!contactsAvailable()) return;
  contactPending = cb;
  try { window.AndroidBridge.pickContact(); }
  catch (e) { contactPending = null; toast("Couldn't open your contacts — type the name instead."); }
}
function decodeOne(s) {
  try { return decodeURIComponent(s || ""); } catch (e) { return s || ""; }
}

/** Choose between the numbers one contact has.
 *
 *  Not built on openModal: that clears #modalRoot, which would throw away the
 *  group dialog underneath. This is its own overlay, stacked above it. */
function pickNumberSheet(name, numbers, onPick) {
  const scrim = el("div", { class: "scrim numsheet" });
  let done = false;
  function close() {
    if (done) return;
    done = true;
    scrim.remove();
    document.removeEventListener("keydown", onEsc);
  }
  function onEsc(ev) { if (ev.key === "Escape") { close(); releaseSheetBack(); } }
  function releaseSheetBack() {
    if (typeof releaseBack === "function") releaseBack("numsheet");
  }

  const box = el("div", { class: "modal" });
  const head = el("div", { class: "modal-hd" });
  head.appendChild(el("h3", { text: "Which number?" }));
  box.appendChild(head);

  const body = el("div", { class: "modal-bd" });
  body.appendChild(el("p", {
    class: "confirm-text",
    html: "<strong>" + esc(name) + "</strong> has " + numbers.length +
          " numbers saved. The number is what hands them the group, so pick the " +
          "one they use on their phone."
  }));
  const list = el("div", { style: "width:100%" });
  numbers.forEach(n => {
    list.appendChild(el("button", {
      class: "btn numsheet-row", type: "button",
      style: "width:100%;justify-content:flex-start;margin-top:8px",
      text: prettyPhone(n.e164) + (n.raw && n.raw !== n.e164 ? "   (" + n.raw + ")" : ""),
      onclick: () => { close(); releaseSheetBack(); onPick(n.e164); }
    }));
  });
  body.appendChild(list);
  box.appendChild(body);

  const foot = el("div", { class: "modal-ft" });
  foot.appendChild(el("button", {
    class: "btn", text: "Cancel",
    onclick: () => { close(); releaseSheetBack(); }
  }));
  box.appendChild(foot);

  scrim.appendChild(box);
  scrim.addEventListener("click", ev => {
    if (ev.target === scrim) { close(); releaseSheetBack(); }
  });
  document.body.appendChild(scrim);
  document.addEventListener("keydown", onEsc);
  if (typeof pushBack === "function") pushBack("numsheet", close);
}

/** The bridge hands back the contact's name and EVERY number saved against it,
 *  percent-encoded and comma-joined. One number is added straight away; more
 *  than one has to be asked about, because picking the wrong one silently
 *  sends the group to a number the person does not use. */
window.__contactPicked = function (nameEnc, phonesEnc) {
  const cb = contactPending; contactPending = null;
  if (!cb) return;
  const name = decodeOne(nameEnc).trim();

  const seen = {}, numbers = [];
  String(phonesEnc || "").split(",").forEach(part => {
    if (!part) return;
    const raw = decodeOne(part).replace(/\s+/g, " ").trim();
    if (!raw) return;
    const e164 = normalisePhone(raw, myCountryCode());
    const key = e164 || raw.replace(/\D/g, "");
    if (!key || seen[key]) return;          // same number written two ways
    seen[key] = true;
    numbers.push({ raw: raw, e164: e164 || raw });
  });

  if (!name && !numbers.length) { toast("No contact chosen"); return; }
  if (numbers.length <= 1) {
    const only = numbers[0];
    cb({ name: name || (only ? only.raw : ""), phone: only ? only.e164 : "" });
    return;
  }
  pickNumberSheet(name || numbers[0].raw, numbers,
                  chosen => cb({ name: name || chosen, phone: chosen }));
};

/* ---------- group modal ---------- */
function openGroupModal(existing) {
  const isNew = !existing;
  const g = existing ? clone(existing) : {
    id: uid("g"), name: "", currency: "INR", members: [], createdAt: nowISO()
  };
  // Whoever opens a new group is in it — they shouldn't have to type themselves
  // in. Name and number both come from the sign-in, and going in first puts
  // them at the top of the list.
  if (isNew) {
    const me = myIdentity();
    // Creating it is what makes you its admin, now and for good. The server
    // records the same thing independently when the group first reaches it.
    g.ownerId = myUserId();
    if (me && (me.name || me.mobile)) {
      const row = { id: uid("m"), name: me.name || prettyPhone(me.mobile), updatedAt: nowISO() };
      if (me.mobile) {
        row.phone = me.mobile;
        if (me.name) rememberContactName(me.mobile, me.name);
      }
      g.members.push(row);
      LS.set(meKey(g.id), row.id);
    }
  }
  const nameIn = el("input", { type: "text", value: g.name, placeholder: "Goa trip, Flat 4B, Sunday football…" });
  const curSel = el("select");
  CURRENCIES.forEach(c => curSel.appendChild(el("option", { value: c.code, text: c.label, selected: g.currency === c.code ? "selected" : null })));

  const chips = el("div", { class: "memberchips" });
  const memIn = el("input", { type: "text", placeholder: "Name", enterkeyhint: "done", autocapitalize: "words", autocomplete: "off" });
  const memPhone = el("input", { type: "tel", inputmode: "numeric", placeholder: "Mobile number (optional)", autocomplete: "off" });
  const memAdd = el("button", { class: "btn", type: "button", text: "Add", onclick: () => addMember() });
  const memContacts = el("button", {
    class: "btn", type: "button", title: "Choose from your contacts",
    onclick: () => pickFromContacts(c => addMember(c.name, c.phone))
  }, [iconSvg("M10.5 13.5v-1a2.5 2.5 0 0 0-2.5-2.5H4.5A2.5 2.5 0 0 0 2 12.5v1M6.25 7.5a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5M14 13.5v-1a2.5 2.5 0 0 0-1.9-2.42M10.5 3.1a2.25 2.25 0 0 1 0 4.3"), document.createTextNode("Contacts")]);

  function addMember(name, phoneRaw) {
    const typed = name === undefined;
    const n = (typed ? memIn.value : name || "").trim();
    const rawPhone = typed ? memPhone.value : phoneRaw;
    const phone = normalisePhone(rawPhone, myCountryCode());
    if (rawPhone && String(rawPhone).trim() && !phone) {
      err.textContent = "That mobile number isn't one we recognise.";
      return false;
    }
    if (!n && !phone) { memIn.focus(); return false; }
    const label = n || prettyPhone(phone);

    const live = liveMembers(g);
    if (phone && live.some(m => m.phone === phone)) {
      toast(label + " is already in this group."); return false;
    }
    if (!phone && live.some(m => (m.name || "").toLowerCase() === label.toLowerCase())) {
      toast(label + " is already in this group."); return false;
    }

    err.textContent = "";
    const m = { id: uid("m"), name: label, updatedAt: nowISO() };
    if (phone) {
      m.phone = phone;
      // What I call this person, on this phone. Everyone else sees their own.
      if (n) rememberContactName(phone, n);
    }
    g.members.push(m);
    if (typed) { memIn.value = ""; memPhone.value = ""; memIn.focus(); }
    drawChips();
    return true;
  }

  function drawChips() {
    chips.innerHTML = "";
    const live = liveMembers(g);
    if (!live.length) { chips.appendChild(el("span", { class: "hint", text: "No members yet." })); return; }
    const list = el("div", { style: "width:100%" });
    live.forEach(m => {
      const row = el("div", { class: "memberline" });
      row.appendChild(el("div", { class: "avatar", text: initials(displayNameFor(m)) }));
      const info = el("div", { class: "mi" });
      const nameRow = el("div", { class: "nm" });
      nameRow.appendChild(document.createTextNode(displayNameFor(m)));
      if (myPhone() && m.phone === myPhone()) nameRow.appendChild(el("span", { class: "tagme", text: "  you" }));
      info.appendChild(nameRow);
      info.appendChild(el("div", {
        class: "ph",
        text: m.phone ? prettyPhone(m.phone) : "no number — won't sync to their phone"
      }));
      row.appendChild(info);
      if (contactsAvailable() && m.phone) {
        row.appendChild(el("button", {
          class: "btn btn-sm btn-ghost", type: "button", title: "Use a name from my contacts",
          text: "Rename", onclick: () => pickFromContacts(c => {
            rememberContactName(m.phone, c.name);
            drawChips(); render();
            toast("Shown as " + c.name + " on this phone");
          })
        }));
      }
      // You can't take yourself out of your own group — that's what deleting
      // the group is for, and the balances would have nowhere to land.
      const isMe = !!(myPhone() && m.phone === myPhone());
      if (!isMe) row.appendChild(el("button", {
        class: "btn btn-sm btn-ghost btn-danger", type: "button",
        "aria-label": "Remove " + displayNameFor(m), text: "Remove",
        onclick: () => {
          const involved = currentExpenses().some(e => (e.splits || {})[m.id] || payersOf(e)[m.id]);
          m.deleted = true; m.updatedAt = nowISO();
          drawChips();
          toast(involved
            ? displayNameFor(m) + " removed — their share of past expenses stays put"
            : displayNameFor(m) + " removed");
        }
      }));
      list.appendChild(row);
    });
    chips.appendChild(list);
  }
  const err = el("div", { class: "hint", style: "color:var(--neg)" });
  memIn.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); memPhone.focus(); } });
  memPhone.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); addMember(); } });
  drawChips();
  const body = [
    field("Group name", nameIn),
    field("Currency", curSel, "Every amount in this group is recorded in this currency."),
    el("div", { class: "field" }, [
      el("label", { text: "Members" }),
      el("div", { class: "memberrow" }, [memIn, contactsAvailable() ? memContacts : null]),
      el("div", { class: "memberrow", style: "margin-top:8px" }, [memPhone, memAdd]),
      el("div", {
        class: "hint",
        text: SYNC_ENABLED
          ? "The mobile number is what lets someone open this group on their own phone. The name is only what YOU see — everyone sees their own contact name for each person."
          : "Type a name and tap Add. A mobile number is optional here."
      }),
      chips
    ]),
    err
  ];

  const save = el("button", {
    class: "btn btn-primary", text: isNew ? "Create group" : "Save changes",
    onclick: async () => {
      if (memIn.value.trim() || memPhone.value.trim()) {
        if (!addMember()) return;            // don't silently drop what they typed
      }
      g.name = nameIn.value.trim();
      g.currency = curSel.value;
      if (!g.name) { err.textContent = "Give the group a name first."; nameIn.classList.add("err"); nameIn.focus(); return; }
      if (liveMembers(g).length < 2) {
        err.textContent = liveMembers(g).length === 1
          ? "Add at least one other person — splitting needs someone to split with."
          : "Add at least two members — splitting needs someone to split with.";
        memIn.focus(); return;
      }
      if (isNew) g.createdAt = nowISO();
      await saveGroup(g);
      closeModal();
      if (isNew) { S.groups.some(x => x.id === g.id) || S.groups.unshift(g); selectGroup(g.id); toast("Group created"); }
      else { S.group = g; toast("Group updated"); render(); }
    }
  });
  const foot = [
    !isNew ? el("button", {
      class: "btn btn-danger", style: "margin-right:auto",
      // Says what it will actually do. For anyone but the creator this button
      // only clears the group off their own phone.
      text: iAmAdmin(existing) ? "Delete group" : "Remove from my phone",
      onclick: () => { closeModal(); confirmDeleteGroup(existing); }
    }) : null,
    el("button", { class: "btn", text: "Cancel", onclick: closeModal }),
    save
  ];
  openModal(isNew ? "New group" : "Group settings", body, foot);
}

/* ---------- expense modal ---------- */
function openExpenseModal(existing) {
  const g = S.group;
  if (!g || liveMembers(g).length < 2) { toast("Add at least two members first."); return; }
  const isNew = !existing;
  const me = myId() || liveMembers(g)[0].id;
  const e = existing ? clone(existing) : {
    id: uid("e"), gid: g.id, description: "", amount: 0, category: "Food & drink",
    date: todayStr(), paidBy: me, payers: null, splitType: "equal",
    parts: liveMembers(g).map(m => m.id), values: {}, splits: {}, createdBy: me, createdAt: nowISO()
  };
  if (!e.parts) e.parts = Object.keys(e.splits || {});
  if (!e.values) e.values = {};

  let multiPayer = !!(e.payers && Object.keys(e.payers).length > 1);
  let payers = e.payers ? clone(e.payers) : (() => { const o = {}; o[e.paidBy] = e.amount; return o; })();

  const descIn = el("input", { type: "text", value: e.description, placeholder: "Dinner at Toit, Uber to airport…" });
  const amtIn = el("input", { type: "number", step: "0.01", min: "0", value: e.amount ? (e.amount / 100).toFixed(2) : "", placeholder: "0.00" });
  const dateIn = el("input", { type: "date", value: e.date });
  const catSel = el("select");
  CATEGORIES.forEach(c => catSel.appendChild(el("option", { value: c, text: c, selected: e.category === c ? "selected" : null })));
  const paidSel = el("select");
  liveMembers(g).forEach(m => paidSel.appendChild(el("option", { value: m.id, text: displayNameFor(m) + (m.id === myId() ? " (you)" : ""), selected: e.paidBy === m.id ? "selected" : null })));

  const payerBox = el("div");
  const multiLink = el("button", { class: "btn btn-sm btn-ghost", type: "button", text: multiPayer ? "Single payer" : "Multiple people paid", onclick: () => { multiPayer = !multiPayer; multiLink.textContent = multiPayer ? "Single payer" : "Multiple people paid"; drawPayers(); recalc(); } });

  function drawPayers() {
    payerBox.innerHTML = "";
    if (!multiPayer) { payerBox.appendChild(paidSel); return; }
    const list = el("div", { class: "split-list" });
    liveMembers(g).forEach(m => {
      const row = el("div", { class: "split-row" });
      row.appendChild(el("span", { class: "nm", text: displayNameFor(m) }));
      const inp = el("input", { type: "number", step: "0.01", min: "0", value: payers[m.id] ? (payers[m.id] / 100).toFixed(2) : "", placeholder: "0.00" });
      inp.addEventListener("input", () => {
        const v = toMinor(inp.value);
        if (v > 0) payers[m.id] = v; else delete payers[m.id];
        recalc();
      });
      row.appendChild(inp);
      list.appendChild(row);
    });
    const foot = el("div", { class: "split-foot", id: "payFoot" });
    list.appendChild(foot);
    payerBox.appendChild(list);
  }

  // split editor
  const typeSeg = el("div", { class: "seg" });
  SPLIT_TYPES.forEach(t => typeSeg.appendChild(el("button", {
    type: "button", "aria-pressed": e.splitType === t.id ? "true" : "false", text: t.label,
    onclick: () => { e.splitType = t.id; Array.from(typeSeg.children).forEach(b => b.setAttribute("aria-pressed", b.textContent === t.label ? "true" : "false")); typeHint.textContent = t.hint; drawSplits(); recalc(); }
  })));
  const typeHint = el("div", { class: "hint", text: (SPLIT_TYPES.find(t => t.id === e.splitType) || SPLIT_TYPES[0]).hint });
  const splitBox = el("div");
  const err = el("div", { class: "hint", style: "color:var(--neg)" });

  function drawSplits() {
    splitBox.innerHTML = "";
    const list = el("div", { class: "split-list" });
    liveMembers(g).forEach(m => {
      const on = e.parts.indexOf(m.id) >= 0;
      const row = el("div", { class: "split-row" + (on ? "" : " off"), "data-m": m.id });
      const cb = el("input", { type: "checkbox", class: "chk", checked: on ? "checked" : null, "aria-label": "Include " + m.name });
      cb.addEventListener("change", () => {
        if (cb.checked) { if (e.parts.indexOf(m.id) < 0) e.parts.push(m.id); }
        else e.parts = e.parts.filter(x => x !== m.id);
        row.classList.toggle("off", !cb.checked);
        recalc();
      });
      row.appendChild(cb);
      row.appendChild(el("span", { class: "nm", text: displayNameFor(m) + (m.id === myId() ? " (you)" : "") }));
      if (e.splitType !== "equal") {
        const inp = el("input", {
          type: "number", step: e.splitType === "shares" ? "1" : "0.01", min: e.splitType === "adjustment" ? null : "0",
          value: e.values[m.id] != null && e.values[m.id] !== "" ? e.values[m.id] : "",
          placeholder: e.splitType === "percentage" ? "%" : e.splitType === "shares" ? "1" : "0.00",
          "data-in": m.id
        });
        inp.addEventListener("input", () => { e.values[m.id] = inp.value === "" ? "" : Number(inp.value); recalc(); });
        row.appendChild(inp);
      }
      row.appendChild(el("span", { class: "calc", "data-calc": m.id, text: "" }));
      list.appendChild(row);
    });
    const foot = el("div", { class: "split-foot" }, [el("span", { id: "splitFootL", text: "" }), el("span", { id: "splitFootR", text: "" })]);
    list.appendChild(foot);
    splitBox.appendChild(list);
    const quick = el("div", { style: "display:flex;gap:8px;margin-top:8px;flex-wrap:wrap" });
    quick.appendChild(el("button", { class: "btn btn-sm", type: "button", text: "Everyone", onclick: () => { e.parts = liveMembers(g).map(m => m.id); drawSplits(); recalc(); } }));
    quick.appendChild(el("button", { class: "btn btn-sm", type: "button", text: "Only me", onclick: () => { e.parts = [myId() || liveMembers(g)[0].id]; drawSplits(); recalc(); } }));
    if (e.splitType === "shares") quick.appendChild(el("button", { class: "btn btn-sm", type: "button", text: "1 share each", onclick: () => { e.parts.forEach(p => (e.values[p] = 1)); drawSplits(); recalc(); } }));
    if (e.splitType === "percentage") quick.appendChild(el("button", {
      class: "btn btn-sm", type: "button", text: "Even %", onclick: () => {
        const per = Math.round((100 / Math.max(1, e.parts.length)) * 100) / 100;
        e.parts.forEach(p => (e.values[p] = per)); drawSplits(); recalc();
      }
    }));
    splitBox.appendChild(quick);
  }

  let computed = {};
  function recalc() {
    const amount = toMinor(amtIn.value);
    e.amount = amount;
    if (!multiPayer) { payers = {}; payers[paidSel.value] = amount; e.paidBy = paidSel.value; }
    computed = computeSplits(amount, e.splitType, e.parts, e.values);
    const assigned = Object.values(computed).reduce((a, b) => a + b, 0);
    liveMembers(g).forEach(m => {
      const c = splitBox.querySelector('[data-calc="' + m.id + '"]');
      if (c) c.textContent = e.parts.indexOf(m.id) >= 0 ? fmt(computed[m.id] || 0, g.currency) : "—";
    });
    const L = $("#splitFootL", splitBox), R = $("#splitFootR", splitBox);
    if (L && R) {
      if (e.splitType === "percentage") {
        const pct = e.parts.reduce((a, p) => a + (Number(e.values[p]) || 0), 0);
        L.textContent = pct.toFixed(2).replace(/\.00$/, "") + "% of 100%";
        R.textContent = Math.abs(pct - 100) < 0.01 ? "balanced" : (pct > 100 ? (pct - 100).toFixed(2) + "% over" : (100 - pct).toFixed(2) + "% left");
        R.className = Math.abs(pct - 100) < 0.01 ? "ok" : "bad";
      } else if (e.splitType === "shares") {
        const tot = e.parts.reduce((a, p) => a + (Number(e.values[p]) || 0), 0);
        L.textContent = tot + " " + (tot === 1 ? "share" : "shares") + " across " + e.parts.length;
        R.textContent = tot > 0 ? "balanced" : "give someone a share";
        R.className = tot > 0 ? "ok" : "bad";
      } else {
        L.textContent = fmt(assigned, g.currency) + " of " + fmt(amount, g.currency);
        const diff = amount - assigned;
        if (amount === 0) { R.textContent = "enter an amount above"; R.className = ""; }
        else { R.textContent = diff === 0 ? "balanced" : diff > 0 ? fmt(diff, g.currency) + " left" : fmt(-diff, g.currency) + " over"; R.className = diff === 0 ? "ok" : "bad"; }
      }
    }
    const pf = $("#payFoot", payerBox);
    if (pf) {
      const paid = Object.values(payers).reduce((a, b) => a + b, 0);
      const diff = amount - paid;
      pf.innerHTML = "";
      pf.appendChild(el("span", { text: fmt(paid, g.currency) + " of " + fmt(amount, g.currency) + " covered" }));
      pf.appendChild(el("span", { class: diff === 0 ? "ok" : "bad", text: diff === 0 ? "balanced" : diff > 0 ? fmt(diff, g.currency) + " unaccounted" : fmt(-diff, g.currency) + " over" }));
    }
  }

  amtIn.addEventListener("input", recalc);
  paidSel.addEventListener("change", recalc);

  drawPayers(); drawSplits();

  const body = [
    field("What was it for?", descIn),
    el("div", { class: "grid2" }, [field("Amount (" + g.currency + ")", amtIn), field("Date", dateIn)]),
    el("div", { class: "grid2" }, [field("Category", catSel), el("div", { class: "field" }, [
      el("label", { text: "Paid by" }), payerBox, multiLink
    ])]),
    el("div", { class: "field" }, [
      el("label", { text: "How is it split?" }),
      typeSeg, typeHint, splitBox
    ]),
    err
  ];

  const save = el("button", {
