    class: "btn btn-primary", text: isNew ? "Add expense" : "Save expense",
    onclick: async () => {
      err.textContent = "";
      const amount = toMinor(amtIn.value);
      if (!descIn.value.trim()) { err.textContent = "Say what the expense was for."; descIn.focus(); return; }
      if (amount <= 0) { err.textContent = "Enter an amount above zero."; amtIn.focus(); return; }
      if (!e.parts.length) { err.textContent = "Pick at least one person to split this between."; return; }
      const paidTotal = Object.values(payers).reduce((a, b) => a + b, 0);
      if (paidTotal !== amount) { err.textContent = "The payers cover " + fmt(paidTotal, g.currency) + " but the expense is " + fmt(amount, g.currency) + "."; return; }
      computed = computeSplits(amount, e.splitType, e.parts, e.values);
      const assigned = Object.values(computed).reduce((a, b) => a + b, 0);
      if (assigned !== amount) {
        err.textContent = e.splitType === "percentage"
          ? "Percentages must add up to 100%."
          : "The split adds up to " + fmt(assigned, g.currency) + ", not " + fmt(amount, g.currency) + ".";
        return;
      }
      const rec = {
        id: e.id, gid: g.id, description: descIn.value.trim(), amount: amount,
        category: catSel.value, date: dateIn.value || todayStr(),
        splitType: e.splitType, values: e.values, parts: e.parts.slice(),
        splits: computed, payers: payers, paidBy: Object.keys(payers)[0],
        createdBy: e.createdBy || myId() || Object.keys(payers)[0],
        createdAt: e.createdAt || nowISO(), updatedAt: nowISO()
      };
      await saveExpense(rec);
      closeModal();
      toast(isNew ? "Expense added" : "Expense updated");
    }
  });
  const foot = [
    !isNew ? el("button", {
      class: "btn btn-danger", style: "margin-right:auto", text: "Delete",
      onclick: () => {
        const label = e.description, eid = e.id;
        closeModal();
        confirmModal({
          title: "Delete this expense?",
          danger: true, confirmLabel: "Delete expense",
          message: "<strong>" + esc(label) + "</strong> will be removed and everyone's balances recalculated.",
          onConfirm: () => { deleteExpense(eid); toast("Expense deleted"); }
        });
      }
    }) : null,
    el("button", { class: "btn", text: "Cancel", onclick: closeModal }),
    save
  ];
  openModal(isNew ? "Add expense" : "Edit expense", body, foot);
  recalc();
}

/* ---------- settle modal ---------- */
function openSettleModal(pref) {
  const g = S.group;
  if (!g || liveMembers(g).length < 2) { toast("Add members first."); return; }
  const me = myId() || liveMembers(g)[0].id;
  const net = netBalances(liveMembers(g), currentExpenses(), currentSettlements());
  const suggested = simplifyDebts(net);
  const d = pref || suggested.find(s => s.from === me) || suggested[0] || { from: me, to: liveMembers(g).find(m => m.id !== me).id, amount: 0 };

  const fromSel = el("select");
  const toSel = el("select");
  liveMembers(g).forEach(m => {
    fromSel.appendChild(el("option", { value: m.id, text: displayNameFor(m) + (m.id === myId() ? " (you)" : ""), selected: d.from === m.id ? "selected" : null }));
    toSel.appendChild(el("option", { value: m.id, text: displayNameFor(m) + (m.id === myId() ? " (you)" : ""), selected: d.to === m.id ? "selected" : null }));
  });
  const amtIn = el("input", { type: "number", step: "0.01", min: "0", value: d.amount ? (d.amount / 100).toFixed(2) : "" });
  const dateIn = el("input", { type: "date", value: todayStr() });
  const methodSel = el("select");
  ["Cash", "UPI", "Bank transfer", "Card", "Wallet", "Other"].forEach(m => methodSel.appendChild(el("option", { value: m, text: m })));
  const noteIn = el("input", { type: "text", placeholder: "Optional note" });
  const err = el("div", { class: "hint", style: "color:var(--neg)" });

  const outstanding = el("div", { class: "hint" });
  function updateOutstanding() {
    const pair = pairwiseDebts(liveMembers(g), currentExpenses(), currentSettlements())
      .find(x => x.from === fromSel.value && x.to === toSel.value);
    outstanding.textContent = pair
      ? memberName(fromSel.value) + " currently owes " + memberName(toSel.value) + " " + fmt(pair.amount, g.currency) + "."
      : "No outstanding debt between these two right now — you can still record a payment.";
  }
  fromSel.addEventListener("change", updateOutstanding);
  toSel.addEventListener("change", updateOutstanding);
  updateOutstanding();

  const body = [
    el("div", { class: "grid2" }, [field("Who paid", fromSel), field("Who received", toSel)]),
    outstanding,
    el("div", { class: "grid2" }, [field("Amount (" + g.currency + ")", amtIn), field("Date", dateIn)]),
    el("div", { class: "grid2" }, [field("Method", methodSel), field("Note", noteIn)]),
    err
  ];
  const save = el("button", {
    class: "btn btn-primary", text: "Record payment",
    onclick: async () => {
      err.textContent = "";
      const amount = toMinor(amtIn.value);
      if (fromSel.value === toSel.value) { err.textContent = "Pick two different people."; return; }
      if (amount <= 0) { err.textContent = "Enter an amount above zero."; amtIn.focus(); return; }
      await saveSettlement({
        id: uid("s"), gid: g.id, from: fromSel.value, to: toSel.value, amount: amount,
        date: dateIn.value || todayStr(), method: methodSel.value, note: noteIn.value.trim(),
        createdBy: myId() || fromSel.value, createdAt: nowISO()
      });
      closeModal();
      toast("Payment recorded");
    }
  });
  openModal("Settle up", body, [el("button", { class: "btn", text: "Cancel", onclick: closeModal }), save]);
}

/* ==========================================================
   8. Identity, contact names, and sync

   Your mobile number is the account. A group member is identified by their
   number too — but the NAME shown is whatever YOU have that number saved as,
   so two people in the same group can each see their own names for everybody.
   The number travels; the name stays on your phone.
   ========================================================== */
const SYNC_ENABLED = true;           // on in the phone build
const COUNTRY_CODES = [
  ["+91", "IN +91"], ["+1", "US +1"], ["+44", "UK +44"], ["+971", "AE +971"],
  ["+65", "SG +65"], ["+61", "AU +61"], ["+49", "DE +49"], ["+81", "JP +81"]
];

/** Mirrors app/phone.py on the server — both ends must agree exactly, or the
 *  same person ends up with two accounts. */
function normalisePhone(raw, defaultCC) {
  if (raw === null || raw === undefined) return null;
  let s = String(raw).trim();
  if (!s) return null;
  s = s.replace(/[^\d+]/g, "");
  if (!s) return null;
  if ((s.match(/\+/g) || []).length > 1) return null;
  if (s.indexOf("+") > 0) return null;
  if (s.slice(0, 2) === "00") s = "+" + s.slice(2);
  if (s[0] !== "+") {
    let cc = String(defaultCC || "+91").replace(/[^\d+]/g, "");
    if (cc[0] !== "+") cc = "+" + cc.replace(/^\++/, "");
    const digits = s.replace(/^0+/, "");
    if (!digits) return null;
    s = cc + digits;
  }
  return /^\+[1-9]\d{7,14}$/.test(s) ? s : null;
}
function prettyPhone(e164) {
  if (!e164) return "";
  if (e164.slice(0, 3) === "+91" && e164.length === 13) {
    return "+91 " + e164.slice(3, 8) + " " + e164.slice(8);
  }
  return e164;
}

/* Kept in step with android/AndroidManifest.xml by hand, and checked by the
   build script so it cannot quietly drift. Shown in the connection check, next
   to the server's own build, because "is the server actually running what I
   pushed?" is otherwise unanswerable from a phone. */
const APP_VERSION = "3.6";

function myIdentity() { return LS.get("sl.identity", null); }
function myPhone() { const i = myIdentity(); return i ? i.mobile : null; }
function myUserId() { const i = myIdentity(); return i && i.userId ? i.userId : null; }

/* ---------- who may delete a group for everyone ----------
 *
 * Whoever created the group, and only them, for the life of the group. The
 * server records it the first time the group is pushed and refuses a delete
 * from anyone else, so this is a real rule and not just a hidden button — a
 * modified app cannot talk its way past it.
 *
 * A group with no recorded creator is one that has never been near a server:
 * it exists on this phone alone, so this phone may do as it likes with it. */
function iAmAdmin(g) {
  if (!g) return false;
  if (!g.ownerId) return true;
  return myUserId() === g.ownerId;
}

/* ---------- groups hidden on this phone only ----------
 *
 * When someone who did not create a group deletes it, it goes away here and
 * nowhere else: they stay in the group, their share of every expense still
 * counts for everybody, and no one is told. This list is the record of that,
 * and it is deliberately never pushed — the server has no idea it exists. */
function hiddenGroupIds() {
  const v = LS.get("sl.hidden", []);
  return Array.isArray(v) ? v : [];
}
function isHidden(id) { return hiddenGroupIds().indexOf(id) >= 0; }
function hideGroup(id) {
  const list = hiddenGroupIds();
  if (list.indexOf(id) < 0) { list.push(id); LS.set("sl.hidden", list); }
  markHiddenDirty(id);
}
/* Tell the server, so that removing a group from your view survives a
   reinstall and agrees across your own devices. It is only ever reported back
   to this account — nobody else in the group is told, which is the whole
   point. An older server ignores it and the behaviour falls back to being
   local to this phone, exactly as before. */
function markHiddenDirty(id) {
  if (!SYNC_ENABLED || !id) return;
  const d = dirtySet();
  if (!d.hidden) d.hidden = [];
  if (d.hidden.indexOf(id) < 0) d.hidden.push(id);
  LS.set("sl.dirty", d);
  cancelHold();
  scheduleSync(600);
}
/** Every group this phone should be showing: not deleted, not hidden here. */
function liveGroups() {
  return S.groups.filter(g => !g.deleted && !isHidden(g.id));
}

/* ---------- per-viewer contact names ---------- */
function contactBook() { return LS.get("sl.contactNames", {}); }
function rememberContactName(phone, name) {
  if (!phone || !name) return;
  const book = contactBook();
  book[phone] = String(name).slice(0, 120);
  LS.set("sl.contactNames", book);
}
/** What THIS phone calls that person. Your address book wins; the name the
 *  group's creator typed is the fallback. */
function displayNameFor(m) {
  if (!m) return "Someone";
  if (m.phone) {
    const mine = contactBook()[m.phone];
    if (mine) return mine;
    if (myPhone() && m.phone === myPhone()) {
      const id = myIdentity();
      if (id && id.name) return id.name;
    }
  }
  return m.name || prettyPhone(m.phone) || "Member";
}

/* ---------- sync ---------- */
/* How long the server may hold an idle request open, in seconds. Kept well
   under the 20s this end abandons a request at. */
const SYNC_HOLD = 15;
const SYNC = {
  state: "off", error: "", at: 0, timer: null, running: false,
  /* Turned off if the server answers a held request straight away several
     times: that means it predates long polling and is ignoring `wait`, and
     racing round again every quarter second would hammer it for nothing. */
  longPoll: true, shortReplies: 0,
  /* The request currently being held open, so it can be abandoned. */
  ctl: null, cancelled: false,
  /* Consecutive failures, for the retry backoff. A failed sync used to
     schedule nothing at all: the only thing that ever tried again was the
     two-minute timer, so a server that took forty seconds to wake cost nearly
     two minutes of dead air with the change sitting unsent. */
  fails: 0,
  /* When the request in flight started, so a request that somehow never
     returns cannot wedge the app for the life of the page. */
  startedAt: 0,
  /* The first sync after launch asks for everything rather than "changes
     since N". It is the one moment the phone can check its whole picture
     against the server's, which matters if its counter is ever ahead of the
     server's — after a restore, or if the database is ever rebuilt. Rows are
     reconciled by id, so asking twice changes nothing. */
  fullPull: true
};

/* Bounded exponential backoff: 2s, 4s, 8s, 16s, 32s, then once a minute for
   as long as it stays broken. Fast enough to ride out a cold start in a few
   seconds, slow enough that a genuinely dead server is not hammered. */
const BACKOFF = [2000, 4000, 8000, 16000, 32000, 60000];
function backoffMs() { return BACKOFF[Math.min(SYNC.fails, BACKOFF.length - 1)]; }

/* A request in flight for longer than this is not in flight any more. Longer
   than any legitimate one: a held request is capped at 15s server-side and
   every request is abandoned at 20s. */
const SYNC_STUCK_MS = 45000;
function unwedge() {
  if (SYNC.running && SYNC.startedAt && Date.now() - SYNC.startedAt > SYNC_STUCK_MS) {
    SYNC.running = false; SYNC.ctl = null; SYNC.startedAt = 0;
  }
}
/** Stop waiting, now.
 *
 *  A held request can sit for fifteen seconds. Anything this phone wants to
 *  send has to go out before then, or adding an expense would look frozen
 *  for a quarter of a minute. So the wait is abandoned rather than queued
 *  behind: nothing is lost, because a request is only held when there was
 *  nothing to push and nothing came back. */
function cancelHold() {
  if (!SYNC.ctl) return;
  SYNC.cancelled = true;
  try { SYNC.ctl.abort(); } catch (e) {}
  SYNC.ctl = null;
}
/** Resolve once no sync is in flight, or false if one is still going after
 *  `ms`. Used only by manual syncs, which have someone waiting on the answer. */
function settleInFlight(ms) {
  return new Promise(resolve => {
    const started = Date.now();
    (function look() {
      if (!SYNC.running) return resolve(true);
      if (Date.now() - started > ms) return resolve(false);
      setTimeout(look, 40);
    })();
  });
}
/* Built in so the app works out of the box. Account -> Sync server overrides
   it; emptying that box stores "" and turns syncing off. */
const DEFAULT_SERVER = "https://split-ledger-71my.onrender.com";
function serverUrl() { return String(LS.get("sl.server", DEFAULT_SERVER) || "").replace(/\/+$/, ""); }
function syncSeq() { return LS.get("sl.syncSeq", 0) || 0; }
function dirtySet() { return LS.get("sl.dirty", { groups: [], expenses: [], settlements: [], hidden: [] }); }
function markDirty(kind, id) {
  if (!SYNC_ENABLED || !id) return;
  const d = dirtySet();
  if (!d[kind]) d[kind] = [];
  if (d[kind].indexOf(id) < 0) d[kind].push(id);
  LS.set("sl.dirty", d);
  cancelHold();
  scheduleSync(1200);
}
function setSyncState(state, error) {
  SYNC.state = state; SYNC.error = error || "";
  if (state === "ok") SYNC.at = Date.now();
  const bar = $("#syncBar");
  if (bar) drawSyncBar();
}
function scheduleSync(ms) {
  if (!SYNC_ENABLED || !serverUrl() || !myIdentity()) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => syncNow(false), ms || 1200);
}

/* Every request gets a deadline. This is not a nicety: the one request that
   did not have one — the token refresh — could be accepted and never answered
   by a host that was still waking up, and then nothing anywhere gave up. The
   sync that was waiting on it never returned, `SYNC.running` stayed true for
   the life of the page, and every later sync bounced straight back off it. The
   app sat on "Syncing…" until it was force-closed. */
const NET_TIMEOUT = 20000;
async function timedFetch(url, init, ms, register) {
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  if (ctl && register) register(ctl);
  const t = ctl ? setTimeout(() => ctl.abort(), ms || NET_TIMEOUT) : null;
  try {
    return await fetch(url, Object.assign({}, init || {},
      { signal: ctl ? ctl.signal : undefined }));
  } finally {
    if (t) clearTimeout(t);
  }
}

async function api(path, body, opts) {
  opts = opts || {};
  const base = serverUrl();
  if (!base) throw new Error("no-server");
  const id = myIdentity();
  const headers = { "Content-Type": "application/json", "X-App-Version": APP_VERSION };
  if (id && id.accessToken && !opts.noAuth) headers["Authorization"] = "Bearer " + id.accessToken;
  let res;
  try {
    res = await timedFetch(base + path, {
      method: "POST", headers: headers, body: JSON.stringify(body || {})
    }, opts.timeout, opts.register);
  } catch (e) {
    // Told to stop waiting because there is something to send. Not a failure.
    throw new Error(opts.register && SYNC.cancelled ? "cancelled" : "offline");
  }

  if (res.status === 401 && !opts.noAuth && !opts.retried && id) {
    // The session went stale. Get a new one and carry on; only give up if
    // even a fresh sign-in is refused.
    const ok = (id.refreshToken && await refreshSession()) || await reauth();
    if (ok) return api(path, body, Object.assign({}, opts, { retried: true }));
    throw new Error("signed-out");
  }
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) {
    const msg = (data && data.message) || ("Server said " + res.status);
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return data;
}

/* Two requests noticing the same expiry must not both spend the refresh token:
   the second would be a replay, and an older server reads that as theft and
   drops every session. One refresh at a time; everyone else waits for it. */
let refreshInFlight = null;
function refreshSession() {
  if (!refreshInFlight) {
    refreshInFlight = doRefresh().finally(() => { refreshInFlight = null; });
  }
  return refreshInFlight;
}

/** Sign in again from the details already on this phone.
 *
 *  The last line of defence. If the refresh token is unusable for any reason —
 *  a reply this phone never received, a server that revoked it, a wiped
 *  sessions table — the mobile number and name are still here, and on a server
 *  with verification off that is all signing in takes. Rate-limited so a
 *  server that refuses everything cannot turn into a login loop.
 *
 *  If verification is ever switched on the server will refuse, and the app
 *  falls back to asking the person, which is the correct outcome. */
let lastReauth = 0;
async function reauth() {
  const id = myIdentity();
  if (!id || !id.mobile || !serverUrl()) return false;
  if (Date.now() - lastReauth < 60000) return false;
  lastReauth = Date.now();
  try {
    const d = await api("/auth/sign-in", {
      mobile_number: id.mobile, name: id.name || "Member",
      platform: "android", device_information: (navigator.userAgent || "").slice(0, 160)
    }, { noAuth: true });
    LS.set("sl.identity", {
      mobile: d.user.mobile_number, name: d.user.name, userId: d.user.id,
      accessToken: d.access_token, refreshToken: d.refresh_token
    });
    return true;
  } catch (e) { return false; }
}

async function doRefresh() {
  const id = myIdentity();
  if (!id || !id.refreshToken) return false;
  try {
    const base = serverUrl();
    // Deadline, like everything else. Without one this call could hang for
    // ever and take the whole sync loop down with it.
    const res = await timedFetch(base + "/auth/refresh-token", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Version": APP_VERSION },
      body: JSON.stringify({ refresh_token: id.refreshToken })
    });
    if (!res.ok) return false;
    const d = await res.json();
    id.accessToken = d.access_token; id.refreshToken = d.refresh_token;
    id.userId = d.user.id;
    LS.set("sl.identity", id);
    return true;
  } catch (e) { return false; }
}

/** Groups that are allowed to leave this phone. The built-in sample never is. */
function syncableGroups() { return S.groups.filter(g => !g.sample && !g.localOnly); }

function buildPush() {
  const d = dirtySet();
  const out = { groups: [], members: [], expenses: [], settlements: [], hidden: [] };
  const skipped = { groups: [], expenses: [], settlements: [] };
  const gById = {};
  syncableGroups().forEach(g => (gById[g.id] = g));

  (d.groups || []).forEach(gid => {
    const g = gById[gid];
    if (!g) { skipped.groups.push(gid); return; }   // gone, or a local-only group
    out.groups.push({
      id: g.id, name: g.name, currency: g.currency || "INR",
      deleted: !!g.deleted, updated_at: g.updatedAt || nowISO()
    });
    (g.members || []).forEach(m => out.members.push({
      id: m.id, group_id: g.id, name: m.name || "", phone: m.phone || null,
      role: m.role || "member", deleted: !!m.deleted,
      updated_at: m.updatedAt || g.updatedAt || nowISO()
    }));
  });
  (d.expenses || []).forEach(eid => {
    const e = S.expenses.find(x => x.id === eid);
    if (!e || !gById[e.gid]) { skipped.expenses.push(eid); return; }
    out.expenses.push({
      id: e.id, group_id: e.gid, description: e.description || "",
      amount_minor: e.amount || 0, currency: (gById[e.gid].currency) || "INR",
      category: e.category || "Other", expense_date: e.date,
      split_type: e.splitType || "equal", paid_by: e.paidBy || null,
      payers: e.payers || {}, splits: e.splits || {}, values: e.values || {},
      deleted: !!e.deleted, updated_at: e.updatedAt || nowISO()
    });
  });
  (d.settlements || []).forEach(sid => {
    const s = S.settlements.find(x => x.id === sid);
    if (!s || !gById[s.gid]) { skipped.settlements.push(sid); return; }
    out.settlements.push({
      id: s.id, group_id: s.gid, from_member: s.from, to_member: s.to,
      amount_minor: s.amount || 0, currency: (gById[s.gid].currency) || "INR",
      method: s.method || null, note: s.note || null,
      settled_date: s.date, deleted: !!s.deleted,
      updated_at: s.updatedAt || nowISO()
    });
  });
  (d.hidden || []).forEach(gid => out.hidden.push({ group_id: gid, hidden: isHidden(gid) }));
  out.__skipped = skipped;
  return out;
}

function applyPull(data) {
  let changed = false;
  /* Groups this account has removed from its own view.
   *
   * This merge is a UNION, and that is the whole point. It was previously
   * written as "adopt the server's list", which meant any group removed here
   * that the server had not been told about was silently un-removed on the
   * next sync — every removal made before the server learned to store them,
   * and every removal whose push had not landed yet. The symptom was a
   * straight swap: remove one group, and a previously removed one takes its
   * place in the list. Removing is one-way now, so a sync can only ever add
   * to this list, never take from it.
   *
   * Anything this phone knows about and the server does not is queued to be
   * sent, so the two converge by telling the server rather than by forgetting.
   * An older server sends no list at all and this whole block does nothing. */
  if (Array.isArray(data.hidden)) {
    const mine = hiddenGroupIds();
    const fromServer = data.hidden.filter(id => mine.indexOf(id) < 0);
    if (fromServer.length) {
      LS.set("sl.hidden", mine.concat(fromServer));
      changed = true;
    }
    const unknown = mine.filter(id => data.hidden.indexOf(id) < 0);
    if (unknown.length) {
      const d = dirtySet();
      d.hidden = (d.hidden || []).concat(unknown.filter(id => (d.hidden || []).indexOf(id) < 0));
      LS.set("sl.dirty", d);
    }
  }
  (data.groups || []).forEach(row => {
    let g = S.groups.find(x => x.id === row.id);
    if (!g) {
      g = { id: row.id, members: [], createdAt: row.updated_at };
      S.groups.push(g);
    }
    g.name = row.name; g.currency = row.currency;
    // Who created it, settled by the server. This is what decides whether the
    // Delete button on this phone deletes for everyone or only here.
    if (row.created_by) g.ownerId = row.created_by;
    g.deleted = !!row.deleted; g.updatedAt = row.updated_at;
    changed = true;
  });
  (data.members || []).forEach(row => {
    const g = S.groups.find(x => x.id === row.group_id);
    if (!g) return;
    if (!g.members) g.members = [];
    let m = g.members.find(x => x.id === row.id);
    if (!m) { m = { id: row.id }; g.members.push(m); }
    m.name = row.name;
    m.phone = row.phone || null;
    m.userId = row.user_id || null;
    m.role = row.role;
    m.deleted = !!row.deleted;
    m.updatedAt = row.updated_at;
    changed = true;
  });
  (data.expenses || []).forEach(row => {
    let e = S.expenses.find(x => x.id === row.id);
    if (!e) { e = { id: row.id }; S.expenses.push(e); }
    e.gid = row.group_id; e.description = row.description; e.amount = row.amount_minor;
    e.category = row.category; e.date = row.expense_date; e.splitType = row.split_type;
    e.paidBy = row.paid_by; e.payers = row.payers || {}; e.splits = row.splits || {};
    e.values = row.values || {}; e.deleted = !!row.deleted; e.updatedAt = row.updated_at;
    changed = true;
  });
  (data.settlements || []).forEach(row => {
    let s = S.settlements.find(x => x.id === row.id);
    if (!s) { s = { id: row.id }; S.settlements.push(s); }
    s.gid = row.group_id; s.from = row.from_member; s.to = row.to_member;
    s.amount = row.amount_minor; s.method = row.method; s.note = row.note;
    s.date = row.settled_date; s.deleted = !!row.deleted; s.updatedAt = row.updated_at;
    changed = true;
  });
  return changed;
}

/** Remove only what this round actually sent.
 *  Anything marked dirty while the request was in flight must survive, or the
 *  change is silently dropped and never sent again. */
function clearPushed(push) {
  const skipped = push.__skipped || { groups: [], expenses: [], settlements: [] };
  const done = {
    groups: new Set(push.groups.map(x => x.id).concat(skipped.groups)),
    expenses: new Set(push.expenses.map(x => x.id).concat(skipped.expenses)),
    settlements: new Set(push.settlements.map(x => x.id).concat(skipped.settlements))
  };
  const d = dirtySet();
  ["groups", "expenses", "settlements"].forEach(k => {
    d[k] = (d[k] || []).filter(id => !done[k].has(id));
  });
  const sentHidden = new Set((push.hidden || []).map(x => x.group_id));
  d.hidden = (d.hidden || []).filter(id => !sentHidden.has(id));
  LS.set("sl.dirty", d);
  return d.groups.length + d.expenses.length + d.settlements.length + d.hidden.length;
}

async function syncNow(manual) {
  if (!SYNC_ENABLED) return false;
  unwedge();
  if (SYNC.running) {
    cancelHold();          // if what is in flight is only a wait, cut it short
    if (!manual) { scheduleSync(1500); return false; }
    /* A manual sync is a person standing there waiting for an answer — they
       tapped Save, or the connection check. Returning false here says "that
       failed", and the caller duly reports *Couldn't reach that server*, when
       in truth the server is fine and we were merely mid-request. Since the
       app now spends most of its time holding a request open, that made Save
       look broken almost every time. So: wait for the request in flight to let
       go — it has just been cancelled, so that is milliseconds — and then do
       the real sync and report what actually happened. */
    if (!(await settleInFlight(5000))) {
      setSyncState("busy");
      return false;
    }
  }
  if (!myIdentity()) { setSyncState("off"); return false; }
  if (!serverUrl()) { setSyncState("local"); return false; }
  SYNC.running = true;
  SYNC.startedAt = Date.now();
  try {
    const push = buildPush();
    const wire = { groups: push.groups, members: push.members,
                   expenses: push.expenses, settlements: push.settlements,
                   hidden: push.hidden };
    /* Long poll. With nothing of our own to send and the app on screen, ask the
       server to hold the request until something appears rather than hanging up
       and asking again later — a group someone else makes then shows up in about
       a second instead of after the next poll. The server caps its side at 15s,
       comfortably inside the 20s this end gives up at. */
    const idle = !wire.groups.length && !wire.members.length &&
                 !wire.expenses.length && !wire.settlements.length &&
                 !wire.hidden.length;
    const holdFor = (idle && !manual && !document.hidden && SYNC.longPoll) ? SYNC_HOLD : 0;
    /* A held request is waiting, not working. Showing "Syncing…" for the
       fifteen seconds it sits there would leave the app looking permanently
       busy, when in fact it is up to date and listening. */
    if (!holdFor) setSyncState("busy");
    const startedAt = Date.now();
    SYNC.cancelled = false;
    // First sync of this launch: ask for the lot and reconcile, rather than
    // trusting a counter this phone has been carrying around.
    const since = SYNC.fullPull ? 0 : syncSeq();
    const data = await api("/sync", { since: since, changes: wire, wait: holdFor },
      holdFor ? { register: c => { SYNC.ctl = c; } } : undefined);
    SYNC.ctl = null;
    SYNC.fullPull = false;
    SYNC.fails = 0;
    const changed = applyPull(data);
    LS.set("sl.syncSeq", data.seq || syncSeq());
    const stillDirty = clearPushed(push);
    if (stillDirty) scheduleSync(800);       // edits made during the request
    localSave();
    if (data.rejected && data.rejected.length) {
      toast(data.rejected.length + " change" + (data.rejected.length === 1 ? "" : "s") + " refused — you're not in that group");
    }
    setSyncState("ok");
    if (changed) {
      const current = liveGroups().find(g => g.id === S.gid);
      // Land on a real group. Sitting on the built-in sample after a sync
      // means anything you add goes into demo data that never leaves the phone.
      const onSample = !current || current.sample;
      if (onSample) {
        const real = liveGroups().filter(g => !g.sample);
        const pick = real.length ? real[real.length - 1] : liveGroups()[0];
        S.gid = pick ? pick.id : null;
        LS.set("sl.lastGroup", S.gid);
      }
      S.group = S.groups.find(g => g.id === S.gid) || null;
      render();
    } else { drawSyncBar(); }
    SYNC.running = false;
    if (holdFor) {
      const heldFor = Date.now() - startedAt;
      if (!changed && heldFor < 2000) {
        // It came back at once with nothing: this server does not know about
        // `wait`. Three of those and we stop asking, and fall back to the
        // periodic poll, rather than spinning.
        if (++SYNC.shortReplies >= 3) SYNC.longPoll = false;
      } else {
        SYNC.shortReplies = 0;
      }
    }
    /* Straight back to waiting. Without this the app would sit out the full
       two-minute poll after every push, so the phone that created a group
       would be the last to learn what anyone did in it. */
    if (SYNC.longPoll && !document.hidden && !stillDirty) scheduleSync(holdFor ? 250 : 400);
    return true;
  } catch (e) {
    SYNC.running = false;
    SYNC.ctl = null;
    const m = e && e.message;
    // We stopped the wait ourselves because there is something to send.
    if (m === "cancelled") { SYNC.cancelled = false; scheduleSync(60); return false; }
    if (m === "offline") setSyncState("offline");
    else if (m === "signed-out") {
      // Refreshing failed AND signing in again failed. Something needs a
      // person, so say so where it will actually be seen — a line inside the
      // drawer is not enough to notice that nothing has synced for a day.
      setSyncState("err", "Sign in again");
      toast("Signed out — tap Account to sign in again. Nothing is lost.");
      if (manual) showAuth();
    }
    else setSyncState("err", m || "Sync failed");
    if (manual && m !== "signed-out") {
      toast(SYNC.state === "offline" ? "No connection — changes are saved here and will sync later" : (SYNC.error || "Sync failed"));
    }
    /* Try again, sooner than the two-minute tick and with a widening gap. A
       host that sleeps when idle takes thirty to sixty seconds to wake, and
       every request during that window is abandoned at twenty — so without
       this the first group made after a quiet spell sat unsent for minutes. */
    SYNC.fails++;
    if (!document.hidden) scheduleSync(backoffMs());
    return false;
  }
}

/* ---------- sign in ---------- */
async function signIn(mobile, name) {
  const base = serverUrl();
  const local = { mobile: mobile, name: name, userId: null, accessToken: null, refreshToken: null };
  if (!base) { LS.set("sl.identity", local); return { ok: true, offline: true }; }
  try {
    const d = await api("/auth/sign-in", {
      mobile_number: mobile, name: name,
      platform: "android", device_information: (navigator.userAgent || "").slice(0, 160)
    }, { noAuth: true });
    LS.set("sl.identity", {
      mobile: d.user.mobile_number, name: d.user.name, userId: d.user.id,
      accessToken: d.access_token, refreshToken: d.refresh_token
    });
    return { ok: true, created: d.created };
  } catch (e) {
    if (e.message === "offline") { LS.set("sl.identity", local); return { ok: true, offline: true }; }
    return { ok: false, error: e.message || "Could not sign in" };
  }
}

async function signOut() {
  try { if (serverUrl() && myIdentity() && myIdentity().accessToken) await api("/auth/logout", {}); }
  catch (e) { /* signing out locally matters more than telling the server */ }
  LS.set("sl.identity", null);
  LS.set("sl.syncSeq", 0);
  LS.set("sl.dirty", { groups: [], expenses: [], settlements: [] });
}

/* ---------- sign-in screen ---------- */
function myCountryCode() { return LS.get("sl.cc", "+91") || "+91"; }

function showAuth() {
  const cc = $("#authCC");
  if (cc && !cc.options.length) {
    COUNTRY_CODES.forEach(([code, label]) =>
      cc.appendChild(el("option", { value: code, text: label })));
  }
  const id = myIdentity();
  cc.value = myCountryCode();
  if (id) {
    $("#authName").value = id.name || "";
    const digits = (id.mobile || "").replace(cc.value, "");
    $("#authPhone").value = digits;
  }
  $("#authErr").textContent = "";
  $("#authNote").textContent = serverUrl()
    ? "Syncing with " + serverUrl()
    : "No server set yet — the app works on its own, and you can add one later to share groups.";
  $("#authScreen").hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#authPhone").focus(), 60);
}
function hideAuth() {
  $("#authScreen").hidden = true;
  document.body.style.overflow = "";
}

async function submitAuth() {
  const err = $("#authErr");
  const cc = $("#authCC").value;
  const mobile = normalisePhone($("#authPhone").value, cc);
  const name = $("#authName").value.trim();
  if (!mobile) { err.textContent = "Check that mobile number."; $("#authPhone").focus(); return; }
  if (!name) { err.textContent = "What should people see you as?"; $("#authName").focus(); return; }

  LS.set("sl.cc", cc);
  const btn = $("#authGo");
  btn.disabled = true; btn.textContent = "Signing in…";
  err.textContent = "";
  const res = await signIn(mobile, name);
  btn.disabled = false; btn.textContent = "Continue";
  if (!res.ok) { err.textContent = res.error; return; }

  rememberContactName(mobile, name);      // I am in my own address book
  hideAuth();
  if (res.offline && serverUrl()) toast("Signed in on this phone — will reach the server when you're online");
  afterSignIn();
}

/** What happens once there is an identity: lock setup, then a first sync. */
function afterSignIn() {
  render();
  if (LOCK_ENABLED && !lockIsSet() && !LS.get("sl.lockSkipped", false)) showLock("setup");
  scheduleSync(400);
}

/* ---------- server settings ---------- */
function drawSyncBar() {
  const bar = $("#syncBar");
  if (!bar || !SYNC_ENABLED) return;
  bar.hidden = false;
  bar.innerHTML = "";
  const map = {
    ok: ["ok", "Synced"], busy: ["busy", "Syncing…"], offline: ["off", "Offline — saved here"],
    err: ["err", SYNC.error || "Sync problem"], local: ["off", "This phone only"], off: ["off", "Not signed in"]
  };
  const [cls, label] = map[SYNC.state] || map.off;
  bar.appendChild(el("span", { class: "syncdot " + cls }));
  bar.appendChild(el("span", { text: label, style: "flex:1" }));
  bar.appendChild(el("button", {
    class: "btn btn-sm btn-ghost", text: "Account", onclick: openAccountModal
  }));
}

/* ---------- connection check ----------
 *
 * "I made a group and it hasn't turned up on his phone" has about six possible
 * causes and the app used to show none of them: the status dot says *Synced*
 * in most of them, because as far as this phone is concerned everything went
 * fine. The one that actually bites — a member whose number nobody has ever
 * signed in with — is completely invisible from here.
 *
 * So: one screen that answers the question. Everything on it is already known
 * to the app or one unauthenticated GET away, and no token, password or
 * server secret appears, so the result is safe to screenshot and send on.
 */
function checkRow(mark, text, detail) {
  const cls = mark === "ok" ? "good" : mark === "no" ? "bad" : "warn";
  const glyph = mark === "ok" ? "✓" : mark === "no" ? "✕" : "!";
  const tx = el("div", { class: "tx", html: text });
  if (detail) tx.appendChild(el("span", { text: detail }));
  return el("div", { class: "chk" }, [el("div", { class: "mk " + cls, text: glyph }), tx]);
}

/** GET, unauthenticated, short fuse. `api()` only speaks POST-with-a-token. */
async function ping(path) {
  const base = serverUrl();
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), 25000) : null;
  const at = Date.now();
  try {
    const res = await fetch(base + path, { method: "GET", signal: ctl ? ctl.signal : undefined });
    if (t) clearTimeout(t);
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data: data, ms: Date.now() - at };
  } catch (e) {
    if (t) clearTimeout(t);
    return { ok: false, status: 0, data: null, ms: Date.now() - at };
  }
}

async function openCheckModal() {
  const list = el("div");
  const plain = [];
  const add = (mark, html, detail, text) => {
    list.appendChild(checkRow(mark, html, detail));
    plain.push((mark === "ok" ? "OK   " : mark === "no" ? "FAIL " : "NOTE ") + (text || html.replace(/<[^>]*>/g, "")));
  };
  const copyBox = el("textarea", { readonly: "readonly", rows: "2",
    style: "position:absolute;left:-9999px;top:0" });
  const copyBtn = el("button", {
    class: "btn", text: "Copy this",
    onclick: () => {
      copyBox.value = plain.join("\n");
      try {
        copyBox.select(); copyBox.setSelectionRange(0, 99999);
        document.execCommand("copy");
        toast("Copied — you can paste it into a message");
      } catch (e) { toast("Couldn't copy — take a screenshot instead"); }
    }
  });
  openModal("Connection check", [list, copyBox],
    [copyBtn, el("button", { class: "btn btn-primary", text: "Close", onclick: closeModal })]);

  list.appendChild(el("p", { class: "hint", text: "Checking…" }));

  const base = serverUrl();
  const id = myIdentity();
  const results = [];

  /* 1 — is there a server at all */
  if (!base) {
    results.push(["no", "<b>Syncing is off on this phone.</b>",
      "There is no server address in Account, so nothing leaves this phone and nothing arrives. Put the address in and tap Save."]);
  } else {
    const h = await ping("/health");
    if (h.ok) {
      const build = h.data && h.data.build;
      results.push(["ok", "<b>Server is answering.</b>", base + " — replied in " + h.ms + "ms"]);
      if (build) {
        results.push([build === APP_VERSION ? "ok" : "warn",
          "<b>Server is running build " + esc(String(build)) + ".</b>",
          build === APP_VERSION
            ? "Same build as this app."
            : "This app is " + APP_VERSION + ". They do not have to match, but if the server is older it will be missing recent fixes — redeploy it."]);
      } else {
        results.push(["warn", "<b>Server is running an old build.</b>",
          "It is older than 3.3 — old enough that it cannot report its version. Groups still sync, but slowly (up to two minutes) and without the newer fixes. Redeploy it."]);
      }
    } else if (h.status) {
      results.push(["no", "<b>The server answered with an error.</b>",
        "HTTP " + h.status + " from " + base + ". If this is a hosting page rather than the app, the deploy has failed or is still running."]);
    } else {
      results.push(["no", "<b>Cannot reach the server.</b>",
        "Nothing came back from " + base + " in " + Math.round(h.ms / 1000) + "s. On a free host the machine sleeps when unused and takes up to a minute to wake — wait a minute and check again. If it never answers, the deploy is down."]);
    }
  }

  /* 2 — who this phone thinks it is */
  if (!id || !id.mobile) {
    results.push(["no", "<b>Not signed in on this phone.</b>", "Tap Account and sign in with your mobile number."]);
  } else {
    results.push(["ok", "<b>Signed in as " + esc(prettyPhone(id.mobile)) + ".</b>",
      id.accessToken ? "This phone has a live session." : "No session token yet — it will sign in again on the next sync."]);
  }

  /* 3 — try an actual sync, which is the thing that is failing */
  if (base && id) {
    const ok = await syncNow(true);
    results.push([ok ? "ok" : "no",
      ok ? "<b>A sync just completed.</b>" : "<b>The sync just failed.</b>",
      ok ? "Everything on this phone has been sent and everything waiting has been collected."
         : (SYNC.error || (SYNC.state === "busy"
              ? "A sync was already running and had not finished. Nothing is wrong — try the check again."
              : "No reason given."))]);
  }

  /* 4 — anything stuck in the outbox */
  const d = dirtySet();
  const waiting = (d.groups || []).length + (d.expenses || []).length + (d.settlements || []).length;
  if (waiting) {
    results.push(["warn", "<b>" + waiting + " change" + (waiting === 1 ? "" : "s") + " still waiting to be sent.</b>",
      "They are saved here and will go as soon as the server can be reached."]);
  }

  /* 5 — the one that is normally the answer.
   *
   * A member only reaches a real person through their mobile number, and only
   * once somebody has signed in with that exact number. Until then the row is
   * a placeholder: the group looks perfectly healthy on this phone and simply
   * does not exist on theirs. */
  const g = S.group;
  if (g) {
    const mems = liveMembers(g);
    const mine = myPhone();
    results.push(["ok", "<b>Group “" + esc(g.name) + "” — " + mems.length + " member" + (mems.length === 1 ? "" : "s") + ".</b>",
      "Checking who can actually receive it."]);
    mems.forEach(m => {
      const who = displayNameFor(m);
      if (!m.phone) {
        results.push(["warn", "&nbsp;&nbsp;<b>" + esc(who) + "</b> — no mobile number",
          "This person exists only on this phone. Add their number so the group can reach them.",
          "  " + who + " - no mobile number, cannot receive the group"]);
      } else if (m.phone === mine) {
        results.push(["ok", "&nbsp;&nbsp;<b>" + esc(who) + "</b> — " + esc(prettyPhone(m.phone)) + " (you)", null,
          "  " + who + " - " + prettyPhone(m.phone) + " (you)"]);
      } else if (m.userId) {
        results.push(["ok", "&nbsp;&nbsp;<b>" + esc(who) + "</b> — " + esc(prettyPhone(m.phone)),
          "Matched to an account. This group is on their phone, or will be the next time they open the app.",
          "  " + who + " - " + prettyPhone(m.phone) + " - matched to an account"]);
      } else {
        results.push(["no", "&nbsp;&nbsp;<b>" + esc(who) + "</b> — " + esc(prettyPhone(m.phone)),
          "Nobody has signed in with this number yet, so the group cannot appear on their phone. They must open Split Buddy and sign in with exactly this number — a different number, even by one digit, is a different person.",
          "  " + who + " - " + prettyPhone(m.phone) + " - NO ACCOUNT, cannot receive the group"]);
      }
    });
  }

  list.innerHTML = "";
  results.forEach(r => add(r[0], r[1], r[2], r[3]));
  drawSyncBar();
}

function openAccountModal() {
  const id = myIdentity();
  const urlIn = el("input", { type: "url", inputmode: "url", autocapitalize: "off",
    autocomplete: "off", placeholder: "https://your-server.example.com", value: serverUrl() });
  const note = el("div", { class: "hint" });
  const warn = el("div", { class: "hint", style: "color:var(--gold)" });

  function checkUrl() {
    const v = urlIn.value.trim();
    warn.textContent = "";
    if (!v) return;
    if (/^http:\/\//i.test(v) && !/^http:\/\/(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/i.test(v)) {
      warn.textContent = "That's a plain http:// address on the open internet — anyone on the network can read what the app sends. Use https:// unless it's your own LAN.";
    }
  }
  urlIn.addEventListener("input", checkUrl);
  checkUrl();

  const body = [
    el("div", { class: "field" }, [
      el("label", { text: "Signed in as" }),
      el("p", { class: "confirm-text", html: id
        ? "<strong>" + esc(id.name) + "</strong><br>" + esc(prettyPhone(id.mobile))
        : "Not signed in." })
    ]),
    field("Sync server", urlIn,
      "The address of your Split Buddy server. Leave it empty to keep everything on this phone."),
    warn, note,
    el("div", { class: "field" }, [
      el("label", { text: "Not syncing?" }),
      el("button", {
        class: "btn", type: "button", text: "Connection check",
        onclick: () => { closeModal(); openCheckModal(); }
      }),
      el("div", { class: "hint", text: "Checks the server, this phone's sign-in, and — most usefully — whether everyone in your current group has actually signed in with the number you added. Safe to screenshot." })
    ])
  ];

  const save = el("button", {
    class: "btn btn-primary", text: "Save", onclick: async () => {
      const v = urlIn.value.trim().replace(/\/+$/, "");
      LS.set("sl.server", v);
      note.textContent = v ? "Checking…" : "Sync turned off.";
      if (!v) { LS.set("sl.syncSeq", 0); setSyncState("local"); closeModal(); render(); return; }
      const cur = myIdentity();
      if (cur && !cur.accessToken) {
        const res = await signIn(cur.mobile, cur.name);
        if (!res.ok) { note.textContent = res.error; return; }
      }
      const ok = await syncNow(true);
      if (ok) { closeModal(); toast("Connected — your groups are syncing"); }
      else if (SYNC.state === "busy") { note.textContent = "Still syncing — give it a moment and tap Save again."; }
      else { note.textContent = SYNC.error || "Couldn't reach that server."; }
    }
  });
  const out = el("button", {
    class: "btn btn-danger", style: "margin-right:auto", text: "Sign out",
    onclick: () => {
      closeModal();
      confirmModal({
        title: "Sign out?",
        danger: true, confirmLabel: "Sign out",
        message: "Groups that have synced stay on the server and come back when you sign in again. Anything that hasn't synced yet is still on this phone.",
        onConfirm: async () => { await signOut(); render(); showAuth(); }
      });
    }
  });
  openModal("Account & sync", body,
    [id ? out : null, el("button", { class: "btn", text: "Close", onclick: closeModal }), save]);
}

/* ==========================================================
   10. Passcode lock
   The phone build turns this on. Everything here runs locally —
   the passcode never leaves the device and is never stored in the
   clear. WebView pages served from file:// are not a secure
   context, so crypto.subtle is unavailable and SHA-256 is done in
   plain JS.
   ========================================================== */
const LOCK_ENABLED = true;
const LOCK_ITER = 25000, LOCK_MAXFAIL = 5, LOCK_COOLDOWN_MS = 30000, LOCK_IDLE_MS = 120000;

const K256 = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];

function sha256(data) {
  let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const len = data.length, bitLenHi = Math.floor(len / 536870912), bitLenLo = (len * 8) >>> 0;
  const buf = new Uint8Array((Math.ceil((len + 9) / 64)) * 64);
  buf.set(data); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(buf.length - 8, bitLenHi);
  dv.setUint32(buf.length - 4, bitLenLo);
  const w = new Uint32Array(64);
  for (let i = 0; i < buf.length; i += 64) {
    for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j * 4);
    for (let j = 16; j < 64; j++) {
      const a = w[j - 15], b = w[j - 2];
      const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
      const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
    }
    let A = h[0], B = h[1], C = h[2], D = h[3], E = h[4], F = h[5], G = h[6], H = h[7];
    for (let j = 0; j < 64; j++) {
      const S1 = ((E >>> 6) | (E << 26)) ^ ((E >>> 11) | (E << 21)) ^ ((E >>> 25) | (E << 7));
      const ch = (E & F) ^ (~E & G);
      const t1 = (H + S1 + ch + K256[j] + w[j]) >>> 0;
      const S0 = ((A >>> 2) | (A << 30)) ^ ((A >>> 13) | (A << 19)) ^ ((A >>> 22) | (A << 10));
      const maj = (A & B) ^ (A & C) ^ (B & C);
      const t2 = (S0 + maj) >>> 0;
      H = G; G = F; F = E; E = (D + t1) >>> 0; D = C; C = B; B = A; A = (t1 + t2) >>> 0;
    }
    h = [(h[0] + A) >>> 0, (h[1] + B) >>> 0, (h[2] + C) >>> 0, (h[3] + D) >>> 0,
    (h[4] + E) >>> 0, (h[5] + F) >>> 0, (h[6] + G) >>> 0, (h[7] + H) >>> 0];
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, h[i]);
  return out;
}
function utf8(s) {
  const o = [];
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c < 0x80) o.push(c);
    else if (c < 0x800) o.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c >= 0xd800 && c < 0xdc00 && i + 1 < s.length) {
      const cp = 0x10000 + ((c - 0xd800) << 10) + (s.charCodeAt(++i) - 0xdc00);
      o.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    } else o.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return new Uint8Array(o);
}
function toHex(b) { let s = ""; for (let i = 0; i < b.length; i++) s += (b[i] < 16 ? "0" : "") + b[i].toString(16); return s; }
function derivePin(pin, salt, iter) {
  let d = sha256(utf8(salt + ":" + pin));
  for (let i = 1; i < iter; i++) d = sha256(d);
  return toHex(d);
}
function randomSalt() {
  const b = new Uint8Array(16);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(b);
  else for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
  return toHex(b);
}

const LOCK = {
  state: null,       // "setup" | "confirm" | "locked" | null
  firstPin: "",
  fails: 0,
  until: 0,
  onDone: null,
  timer: null
};
function lockRecord() { return LS.get("sl.lock", null); }
function lockIsSet() { return !!(lockRecord() && lockRecord().hash); }

function showLock(mode, onDone) {
  LOCK.state = mode; LOCK.firstPin = ""; LOCK.onDone = onDone || null;
  $("#lockScreen").hidden = false;
  document.body.style.overflow = "hidden";
  drawLock();
}
function hideLock() {
  LOCK.state = null;
  $("#lockScreen").hidden = true;
  document.body.style.overflow = "";
  clearInterval(LOCK.timer); LOCK.timer = null;
}

function drawLock() {
  const title = $("#lockTitle"), sub = $("#lockSub"), acts = $("#lockActions");
  $("#lockErr").textContent = "";
  acts.innerHTML = "";
  if (LOCK.state === "setup") {
    title.textContent = "Create a passcode";
    sub.textContent = "Four digits, asked for each time you open Split Buddy. It stays on this phone.";
  } else if (LOCK.state === "confirm") {
    title.textContent = "Confirm your passcode";
    sub.textContent = "Enter the same four digits again.";
  } else {
    title.textContent = "Enter your passcode";
    sub.textContent = "Split Buddy is locked.";
  }
  buildPin();
  if (LOCK.state === "setup") {
    acts.appendChild(el("p", { class: "lock-note", text: "There's no way to recover a forgotten passcode — the app's data is only on this phone. Keep a backup if it matters." }));
    acts.appendChild(el("button", { class: "lock-link", text: "Not now", onclick: () => { LS.set("sl.lockSkipped", true); hideLock(); render(); } }));
  } else if (LOCK.state === "locked") {
    acts.appendChild(el("button", {
      class: "lock-link", text: "Forgot your passcode?",
      onclick: () => {
        $("#lockScreen").hidden = true;
        confirmModal({
          title: "Erase and start over?",
          danger: true, confirmLabel: "Erase everything",
          message: "A passcode can't be recovered — it isn't stored anywhere, only a scrambled check of it is.\n\nThe only way back in is to erase this app's data: <strong>every group, expense and payment on this phone</strong>. If you have a backup you can restore it afterwards.",
          onConfirm: () => { try { localStorage.clear(); } catch (e) { } location.reload(); }
        });
        const scrim = $(".scrim");
        if (scrim) scrim.addEventListener("click", () => { if (!$(".modal")) $("#lockScreen").hidden = false; });
        const restore = () => { if (!$("#modalRoot").innerHTML) { $("#lockScreen").hidden = false; document.removeEventListener("click", restore, true); } };
        setTimeout(() => document.addEventListener("click", restore, true), 0);
      }
    }));
  }
}

function buildPin() {
  const box = $("#pinBoxes"); box.innerHTML = ""; box.className = "pin";
  for (let i = 0; i < 4; i++) {
    const inp = el("input", {
      type: "tel", inputmode: "numeric", maxlength: "1", id: "pin" + i,
      autocomplete: "off", "aria-label": "Passcode digit " + (i + 1)
    });
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "").slice(0, 1);
      inp.classList.toggle("filled", !!inp.value);
      box.classList.remove("bad");
      if (inp.value && i < 3) $("#pin" + (i + 1)).focus();
      maybeSubmitPin();
    });
    inp.addEventListener("keydown", ev => {
      if (ev.key === "Backspace" && !inp.value && i > 0) { ev.preventDefault(); const p = $("#pin" + (i - 1)); p.value = ""; p.classList.remove("filled"); p.focus(); }
    });
    inp.addEventListener("paste", ev => {
      const t = (ev.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 4);
      if (!t) return;
      ev.preventDefault();
      for (let k = 0; k < 4; k++) { const b = $("#pin" + k); b.value = t[k] || ""; b.classList.toggle("filled", !!b.value); }
      maybeSubmitPin();
    });
    box.appendChild(inp);
  }
  setTimeout(() => { const f = $("#pin0"); if (f) f.focus(); }, 60);
}
function readPin() { let s = ""; for (let i = 0; i < 4; i++) s += ($("#pin" + i) || {}).value || ""; return s; }
function clearPin(bad) {
  const box = $("#pinBoxes");
  if (bad) { box.classList.add("bad"); setTimeout(() => box.classList.remove("bad"), 400); }
  for (let i = 0; i < 4; i++) { const b = $("#pin" + i); if (b) { b.value = ""; b.classList.remove("filled"); } }
  setTimeout(() => { const f = $("#pin0"); if (f) f.focus(); }, bad ? 420 : 0);
}
function pinBusy(on) {
  for (let i = 0; i < 4; i++) { const b = $("#pin" + i); if (b) b.disabled = on; }
}

function maybeSubmitPin() {
  const pin = readPin();
  if (pin.length < 4) return;
  if (Date.now() < LOCK.until) return;
  pinBusy(true);
  // let the browser paint the last digit before the hash blocks the thread
  setTimeout(() => {
    submitPin(pin);
    if (Date.now() >= LOCK.until) pinBusy(false);   // a cooldown must stay disabled
  }, 30);
}

function submitPin(pin) {
  const err = $("#lockErr");
  if (LOCK.state === "setup") {
    LOCK.firstPin = pin; LOCK.state = "confirm"; drawLock(); return;
  }
  if (LOCK.state === "confirm") {
    if (pin !== LOCK.firstPin) {
      LOCK.state = "setup"; LOCK.firstPin = "";
      drawLock();                                   // drawLock clears the error, so set it after
      $("#lockErr").textContent = "Those didn't match. Start again.";
      clearPin(true);
      return;
    }
    const salt = randomSalt();
    LS.set("sl.lock", { v: 1, salt: salt, iter: LOCK_ITER, hash: derivePin(pin, salt, LOCK_ITER) });
    LS.set("sl.lockSkipped", false);
    hideLock(); render(); toast("Passcode set");
    if (LOCK.onDone) LOCK.onDone();
    return;
  }
  // unlocking
  const rec = lockRecord();
  if (!rec) { hideLock(); render(); return; }
  if (derivePin(pin, rec.salt, rec.iter || LOCK_ITER) === rec.hash) {
    LOCK.fails = 0;
    hideLock(); render();
    scheduleSync(300);
    if (LOCK.onDone) { const d = LOCK.onDone; LOCK.onDone = null; d(); }
    return;
  }
  LOCK.fails++;
  clearPin(true);
  const left = LOCK_MAXFAIL - LOCK.fails;
  if (left <= 0) {
    LOCK.until = Date.now() + LOCK_COOLDOWN_MS;
    LOCK.fails = 0;
    startCooldown();
  } else {
    err.textContent = "Wrong passcode — " + left + " " + (left === 1 ? "try" : "tries") + " left.";
  }
}
function startCooldown() {
  pinBusy(true);
  clearInterval(LOCK.timer);
  const tick = () => {
    const s = Math.ceil((LOCK.until - Date.now()) / 1000);
    if (s <= 0) {
      clearInterval(LOCK.timer); LOCK.timer = null;
      $("#lockErr").textContent = ""; pinBusy(false); clearPin(false);
      return;
    }
    $("#lockErr").textContent = "Too many attempts. Try again in " + s + "s.";
  };
  tick();
  LOCK.timer = setInterval(tick, 1000);
}

/** Lock now, or set one up if there isn't one. */
function lockNow() {
  if (!lockIsSet()) { showLock("setup"); return; }
  showLock("locked");
}
function openLockSettings() {
  const set = lockIsSet();
  const body = [el("p", {
    class: "confirm-text",
    html: set
      ? "Split Buddy asks for your four-digit passcode each time you open it, and again after two minutes in the background."
      : "You can set a four-digit passcode. It's asked for each time you open Split Buddy, and it never leaves this phone."
  })];
  const acts = [];
  if (set) {
    acts.push(el("button", { class: "btn", text: "Change passcode", onclick: () => { closeModal(); setTimeout(() => showLock("setup"), 60); } }));
    acts.push(el("button", {
      class: "btn btn-danger", text: "Turn off", onclick: () => {
        closeModal();
        confirmModal({
          title: "Turn off the passcode?",
          danger: true, confirmLabel: "Turn it off",
          message: "Anyone who picks up this phone will be able to open Split Buddy and see every group and expense in it.",
          onConfirm: () => { LS.set("sl.lock", null); LS.set("sl.lockSkipped", true); toast("Passcode turned off"); }
        });
      }
    }));
    acts.push(el("button", { class: "btn btn-primary", text: "Lock now", onclick: () => { closeModal(); setTimeout(() => showLock("locked"), 60); } }));
  } else {
    acts.push(el("button", { class: "btn", text: "Cancel", onclick: closeModal }));
    acts.push(el("button", { class: "btn btn-primary", text: "Set a passcode", onclick: () => { closeModal(); setTimeout(() => showLock("setup"), 60); } }));
  }
  openModal(set ? "Passcode" : "Set a passcode", body, acts);
}

/** Re-lock after a spell in the background. */
function watchIdle() {
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (!LOCK_ENABLED || !lockIsSet() || LOCK.state) return;
    if (hiddenAt && Date.now() - hiddenAt > LOCK_IDLE_MS) showLock("locked");
  });
}

/** Show or hide the groups drawer. The phone build overrides this to also

/* ---------- backup & restore ---------- */

    ]),

          + ((d.expenses || []).length) + "</strong> expenses.\n\nEverything currently in the app is discarded and replaced.",
        onConfirm: () => {

          localSave();

/* ---------- first run ----------
   Nothing is seeded. A new install opens empty, so every group anyone ever
   sees is either one they made or one they were added to by number.

   Builds before 2.4 shipped a demo group, "Goa Trip 2026". It is cleared here
   on upgrade — but only while it is still exactly as it shipped. If the ids in
   it do not match the ones that were seeded, somebody has been using it as a
   real group, and it is left alone rather than deleted under them. */
const DEMO_GID = "goa-sample";
const DEMO_EXPENSES = ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8"];
const DEMO_SETTLEMENTS = ["s1"];

function sameIds(got, want) {
  if (got.length !== want.length) return false;
  const w = {};
  want.forEach(id => { w[id] = true; });
  return got.every(id => w[id]);
}

function dropDemoGroup() {
  if (!S.groups.some(g => g.id === DEMO_GID)) return;
  const exp = S.expenses.filter(e => e.gid === DEMO_GID).map(e => e.id);
  const set = S.settlements.filter(s => s.gid === DEMO_GID).map(s => s.id);
  if (!sameIds(exp, DEMO_EXPENSES) || !sameIds(set, DEMO_SETTLEMENTS)) return;
  S.groups = S.groups.filter(g => g.id !== DEMO_GID);
  S.expenses = S.expenses.filter(e => e.gid !== DEMO_GID);
  S.settlements = S.settlements.filter(s => s.gid !== DEMO_GID);
  try { localStorage.removeItem(meKey(DEMO_GID)); } catch (e) { }
  if (LS.get("sl.lastGroup", null) === DEMO_GID) LS.set("sl.lastGroup", null);
  localSave();
}

applyStoredTheme();
localLoad();
dropDemoGroup();
S.ready = true;
S.gid = LS.get("sl.lastGroup", null);
// A group hidden on this phone must not be the one we open on.
if (!S.gid || !liveGroups().some(g => g.id === S.gid)) S.gid = liveGroups()[0] ? liveGroups()[0].id : null;
S.group = S.groups.find(g => g.id === S.gid) || null;
render();

/* ---------- who you are, then the lock, then the ledger ---------- */
$("#lockBtn").hidden = false;
watchIdle();
drawSyncBar();

window.addEventListener("online", () => scheduleSync(500));
document.addEventListener("visibilitychange", () => { if (!document.hidden) scheduleSync(900); });
setInterval(() => { if (!document.hidden) scheduleSync(0); }, 120000);

if (!myIdentity()) {
  showAuth();
} else if (lockIsSet()) {
  showLock("locked");
} else {
  if (!LS.get("sl.lockSkipped", false)) showLock("setup");
  scheduleSync(600);
}

})();
</script>

</body>
</html>
